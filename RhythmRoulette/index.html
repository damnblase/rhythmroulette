<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRR</title>

  <style>
    /* =========================================================
      MINIMAL WHITE UI
    ========================================================= */

    :root{
      --ui-bg: #ffffff;
      --ui-fg: #000000;

      --ui-border: #000000;
      --ui-radius: 10px;

      --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial;
      --ui-font-size: 14px;
      --ui-line-height: 1.25;

      --ui-pad-y: 10px;
      --ui-pad-x: 12px;

      --ui-gap: 10px;
      --ui-page-pad: 18px;
      --ui-max-width: 100%;
    }

    html, body{
      margin:0;
      height:100%;
      background: var(--ui-bg);
      color: var(--ui-fg);
      font-family: var(--ui-font);
      font-size: var(--ui-font-size);
      line-height: var(--ui-line-height);
    }

    .minui-wrap{
      max-width: var(--ui-max-width);
      padding: var(--ui-page-pad);
      margin: 0 auto;
      display: grid;
      gap: var(--ui-gap);
    }

    /* ===== HEADER ROW ===== */
    .minui-header{
      display:flex;
      justify-content: space-between;
      align-items: center;
    }

    .minui-title{
      font-weight: 600;
      font-size: 14px;
    }

    .minui-controls{
      display:flex;
      align-items:center;
      gap: var(--ui-gap);
    }

    .dark-toggle{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
    }

    .dark-toggle:focus{
      outline: none;
    }

    .icon-toggle{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
      line-height: 0;
    }

    .icon-toggle:focus{
      outline: none;
    }

    .icon-toggle::-moz-focus-inner{
      border: 0;
    }

    .minui-row{
      display:flex;
      flex-wrap:wrap;
      gap: var(--ui-gap);
    }

    /* ===== FRAME (BORDERS REMOVED) ===== */
    .minui-frame{
      flex: 1 1 420px;
      min-width: 320px;
      border: none;               /* removed */
      border-radius: 0;           /* removed */
      background: var(--ui-bg);
      overflow: hidden;
    }

    .minui-frame-header{
      padding: 8px 12px;
      border-bottom: none;        /* removed */
      font-weight: 500;
      font-size: 14px;
    }

    .minui-frame iframe{
      width: 100%;
      height: 300px;
      max-height: 400px;
      border: 0;
      display: block;
      background: var(--ui-bg);
      overflow-y: auto;
    }

    #singleView{
      padding: 0;
    }

    .rr-tabs{
      display:flex;
      flex-wrap:wrap;
      gap: var(--ui-gap);
      margin: 0 0 var(--ui-gap) 0;
    }

    .rr-tab{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
    }

    .rr-tab:focus{
      outline: none;
    }

    .rr-tab[aria-selected="true"]{
      text-decoration: underline;
    }

    .rr-single iframe{
      width: 100%;
      height: calc(100vh - 190px);
      max-height: none;
      border: 0;
      display:block;
      background: var(--ui-bg);
    }

    /* =========================================================
      DARK MODE (GLOBAL DISPLAY INVERSION)
    ========================================================= */

    html.dark-mode{
      filter: invert(1) hue-rotate(180deg);
    }

    html.dark-mode img,
    html.dark-mode video{
      filter: invert(1) hue-rotate(180deg);
    }
  </style>
  <script src="./rr-ui.js" defer></script>
</head>

<body>
  <div class="minui-wrap">

    <div class="minui-header">
      <div class="minui-title">RR</div>
      <div class="minui-controls">
        <button id="viewModeToggle" class="icon-toggle" type="button" aria-label="Toggle view"></button>
        <button id="darkModeToggle" class="dark-toggle">dark</button>
      </div>
    </div>

    <div id="gridView">
      <div class="minui-row">


        <div class="minui-frame">
          <div class="minui-frame-header">Cadence</div>
          <iframe src="Cadence.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Rhythm</div>
          <iframe src="Rhythm.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Harmony</div>
          <iframe src="Harmony.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Bassline</div>
          <iframe src="Bassline.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Shaker</div>
          <iframe src="Shaker.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Ride</div>
          <iframe src="Ride.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">MIDI Control</div>
          <iframe src="midicontrol.html"></iframe>
        </div>
      </div>
    </div>

    <div id="singleView" hidden>
      <div class="rr-tabs" id="moduleTabs"></div>
      <div class="minui-frame rr-single">
        <div class="minui-frame-header" id="singleHeader">Cadence</div>
        <iframe id="singleIframe" src="Cadence.html"></iframe>
      </div>
    </div>
  </div>

<script>
/* DARK MODE TOGGLE */
(() => {
  const btn = document.getElementById('darkModeToggle');
  if (!btn) return;

  document.documentElement.classList.remove('dark-mode');
  btn.textContent = 'dark';

  btn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark-mode');
    btn.textContent = isDark ? 'light' : 'dark';
  });
})();
</script>

<script>
(() => {
  const MODULES = [
    { id: "cadence",  label: "Cadence",  src: "Cadence.html" },
    { id: "rhythm",   label: "Rhythm",   src: "Rhythm.html" },
    { id: "harmony",  label: "Harmony",  src: "Harmony.html" },
    { id: "bassline", label: "Bassline", src: "Bassline.html" },
    { id: "shaker",   label: "Shaker",   src: "Shaker.html" },
    { id: "ride",     label: "Ride",     src: "Ride.html" },
    { id: "midictrl", label: "MIDI Control", src: "midicontrol.html" },
  ];

  const gridView = document.getElementById("gridView");
  const singleView = document.getElementById("singleView");
  const tabsEl = document.getElementById("moduleTabs");
  const singleIframe = document.getElementById("singleIframe");
  const singleHeader = document.getElementById("singleHeader");
  const btn = document.getElementById("viewModeToggle");

  if (!gridView || !singleView || !tabsEl || !singleIframe || !singleHeader || !btn) return;

  const ICON_GRID = `
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="2" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="11" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="2" y="11" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="11" y="11" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  `;

  const ICON_SINGLE = `
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="2" y="2" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="7" y1="2" x2="7" y2="16" stroke="currentColor" stroke-width="2"/>
      <line x1="11" y1="2" x2="11" y2="16" stroke="currentColor" stroke-width="2"/>
    </svg>
  `;

  function setViewMode(mode) {
    const isSingle = mode === "single";
    gridView.hidden = isSingle;
    singleView.hidden = !isSingle;
    btn.innerHTML = isSingle ? ICON_GRID : ICON_SINGLE; // icon represents the other view
    localStorage.setItem("rr_view_mode", isSingle ? "single" : "grid");
  }

  function setActiveModule(moduleId) {
    const m = MODULES.find(x => x.id === moduleId) || MODULES[0];

    tabsEl.querySelectorAll(".rr-tab").forEach(b => {
      b.setAttribute("aria-selected", b.dataset.moduleId === m.id ? "true" : "false");
    });

    singleHeader.textContent = m.label;
    if (singleIframe.getAttribute("src") !== m.src) {
      singleIframe.setAttribute("src", m.src);
    }

    localStorage.setItem("rr_active_module", m.id);
  }

  function buildTabs() {
    tabsEl.innerHTML = "";
    MODULES.forEach(m => {
      const b = document.createElement("button");
      b.className = "rr-tab";
      b.type = "button";
      b.textContent = m.label;
      b.dataset.moduleId = m.id;
      b.setAttribute("aria-selected", "false");
      b.addEventListener("click", () => setActiveModule(m.id));
      tabsEl.appendChild(b);
    });
  }

  buildTabs();

  const initialMode = localStorage.getItem("rr_view_mode") || "grid";
  setViewMode(initialMode);

  const initialModule = localStorage.getItem("rr_active_module") || MODULES[0].id;
  setActiveModule(initialModule);

  btn.addEventListener("click", () => {
    const current = localStorage.getItem("rr_view_mode") || "grid";
    setViewMode(current === "grid" ? "single" : "grid");
  });
})();
</script>

<script>
(() => {
  const EXTRA_BOTTOM_PX = 5;
  const MAX_IFRAME_HEIGHT = 520;

  const iframes = () => Array.from(document.querySelectorAll('#gridView iframe'));
  const naturalHeights = new WeakMap();
  let rafPending = false;

  const schedule = () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      resizeAndEqualize();
    });
  };

  const safeNumber = (v, fallback) => (Number.isFinite(v) && v > 0 ? v : fallback);

  function measureSameOrigin(iframe) {
    try {
      const doc = iframe.contentDocument;
      if (!doc) return null;
      const body = doc.body;
      const de = doc.documentElement;
      if (!body || !de) return null;

      const h = Math.max(
        body.scrollHeight, de.scrollHeight,
        body.offsetHeight, de.offsetHeight,
        body.clientHeight, de.clientHeight
      );

      return Math.ceil(h + EXTRA_BOTTOM_PX);
    } catch {
      return null;
    }
  }

  function getNaturalHeight(iframe) {
    const sameOrigin = measureSameOrigin(iframe);
    if (sameOrigin !== null) {
      naturalHeights.set(iframe, sameOrigin);
      return sameOrigin;
    }
    const prev = naturalHeights.get(iframe);
    if (prev) return prev;
    const rect = iframe.getBoundingClientRect();
    return Math.max(100, Math.ceil(rect.height || 0));
  }

  function groupByRow(iframeList) {
    const tolerance = 2;
    const rows = [];
    for (const iframe of iframeList) {
      const top = Math.round(iframe.getBoundingClientRect().top);
      let row = rows.find(r => Math.abs(r.top - top) <= tolerance);
      if (!row) {
        row = { top, items: [] };
        rows.push(row);
      }
      row.items.push(iframe);
    }
    rows.sort((a,b) => a.top - b.top);
    return rows;
  }

  function resizeAndEqualize() {
    const list = iframes();
    if (!list.length) return;

    const natural = new Map();
    for (const iframe of list) {
      natural.set(iframe, getNaturalHeight(iframe));
    }

    const rows = groupByRow(list);

    for (const row of rows) {
      let maxH = 0;
      for (const iframe of row.items) {
        maxH = Math.max(maxH, safeNumber(natural.get(iframe), 0));
      }
      if (!maxH) continue;
      for (const iframe of row.items) {
        iframe.style.height = `${Math.min(maxH, MAX_IFRAME_HEIGHT)}px`;
      }
    }
  }

  window.addEventListener('resize', schedule, { passive: true });
  schedule();
})();
</script>

</body>
</html>
