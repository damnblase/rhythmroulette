<!DOCTYPE html>
<html lang="en" class="rr-dark" data-rr-theme="legacy-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RR</title>

  <style>
    /* =========================================================
      MINIMAL WHITE UI
    ========================================================= */

    :root{
      --ui-bg: #111315;
      --ui-fg: #e7ebef;

      --ui-border: #2a3138;
      --ui-radius: 10px;

      --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial;
      --ui-font-size: 14px;
      --ui-line-height: 1.25;

      --ui-pad-y: 10px;
      --ui-pad-x: 12px;

      --ui-gap: 10px;
      --ui-page-pad: 18px;
      --ui-max-width: 100%;
    }

    html, body{
      margin:0;
      height:100%;
      background: var(--ui-bg);
      color: var(--ui-fg);
      font-family: var(--ui-font);
      font-size: var(--ui-font-size);
      line-height: var(--ui-line-height);
    }

    .minui-wrap{
      max-width: var(--ui-max-width);
      padding: var(--ui-page-pad);
      margin: 0 auto;
      display: grid;
      gap: 8px;
    }

    /* ===== HEADER ROW ===== */
    .minui-header{
      display:flex;
      justify-content: space-between;
      align-items: center;
    }

    .minui-title{
      font-weight: 600;
      font-size: 14px;
    }

    .minui-controls{
      display:flex;
      align-items:center;
      gap: var(--ui-gap);
    }

    .dark-toggle,
    .theme-switcher{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
    }

    .dark-toggle:focus,
    .theme-switcher:focus{
      outline: none;
    }

    .icon-toggle{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
      line-height: 0;
    }

    .icon-toggle:focus{
      outline: none;
    }

    .icon-toggle::-moz-focus-inner{
      border: 0;
    }

    .minui-row{
      display:flex;
      flex-wrap:wrap;
      gap: var(--ui-gap);
    }

    /* ===== FRAME (BORDERS REMOVED) ===== */
    .minui-frame{
      flex: 1 1 420px;
      min-width: 320px;
      border: none;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
    }

    .minui-frame-header{
      padding: 0;
      border-bottom: none;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b96a3;
      margin: 0 0 4px 0;
    }

    .minui-frame iframe{
      width: 100%;
      height: 260px;
      max-height: none;
      border: 0;
      display: block;
      background: transparent;
      overflow: hidden;
    }

    #singleView{
      padding: 0;
    }

    .rr-tabs{
      display:flex;
      flex-wrap:wrap;
      gap: var(--ui-gap);
      margin: 0 0 var(--ui-gap) 0;
    }

    .rr-tab{
      font-family: var(--ui-font);
      font-size: 14px;
      font-weight: 600;
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--ui-fg);
    }

    .rr-tab:focus{
      outline: none;
    }

    .rr-tab[aria-selected="true"]{
      text-decoration: underline;
    }

    .rr-single iframe{
      width: 100%;
      height: calc(100vh - 190px);
      max-height: none;
      border: 0;
      display:block;
      background: var(--ui-bg);
    }

  </style>
  <link rel="stylesheet" href="./rr-ui.css">
  <script src="./rr-ui.js" defer></script>
</head>

<body>
  <div class="minui-wrap">

    <div class="minui-header">
      <div class="minui-title">RR</div>
      <div class="minui-controls">
        <button id="viewModeToggle" class="icon-toggle" type="button" aria-label="Toggle view"></button>
        <select id="themeSwitcher" class="theme-switcher" aria-label="Theme switcher">
          <option value="legacy-dark">Dark</option>
          <option value="flat-light">Light</option>
          <option value="ableton-dark">Ableton</option>
        </select>
      </div>
    </div>

    <div id="gridView">
      <div class="minui-row">


        <div class="minui-frame">
          <div class="minui-frame-header">Cadence</div>
          <iframe src="Cadence.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Rhythm</div>
          <iframe src="Rhythm.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Harmony</div>
          <iframe src="Harmony.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Bassline</div>
          <iframe src="Bassline.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Shaker</div>
          <iframe src="Shaker.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Ride</div>
          <iframe src="Ride.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">MIDI Control</div>
          <iframe src="Midicontrol.html"></iframe>
        </div>

        <div class="minui-frame">
          <div class="minui-frame-header">Key2cc</div>
          <iframe src="Key2cc.html"></iframe>
        </div>

      </div>
    </div>

    <div id="singleView" hidden>
      <div class="rr-tabs" id="moduleTabs"></div>
      <div class="minui-frame rr-single">
        <div class="minui-frame-header" id="singleHeader">Cadence</div>
        <iframe id="singleIframe" src="Cadence.html"></iframe>
      </div>
    </div>
  </div>

<script>
/* THEME SELECTOR */
(() => {
  const root = document.documentElement;
  const sel = document.getElementById('themeSwitcher');
  if (!sel) return;

  const key = "rr_theme_id";
  const allowed = new Set(["legacy-dark", "ableton-dark", "flat-light"]);
  const saved = localStorage.getItem(key);
  const initialTheme = allowed.has(saved) ? saved : "legacy-dark";

  function applyTheme(themeId) {
    const next = allowed.has(themeId) ? themeId : "legacy-dark";
    root.setAttribute("data-rr-theme", next);
    root.classList.toggle("rr-dark", next !== "flat-light");
    sel.value = next;
    localStorage.setItem(key, next);
  }

  applyTheme(initialTheme);
  sel.addEventListener("change", () => applyTheme(sel.value));
})();
</script>

<script>
(() => {
  const MODULES = [
    { id: "cadence",  label: "Cadence",  src: "Cadence.html" },
    { id: "rhythm",   label: "Rhythm",   src: "Rhythm.html" },
    { id: "harmony",  label: "Harmony",  src: "Harmony.html" },
    { id: "bassline", label: "Bassline", src: "Bassline.html" },
    { id: "shaker",   label: "Shaker",   src: "Shaker.html" },
    { id: "ride",     label: "Ride",     src: "Ride.html" },
    { id: "midictrl", label: "MIDI Control", src: "midicontrol.html" },
  ];

  const gridView = document.getElementById("gridView");
  const singleView = document.getElementById("singleView");
  const tabsEl = document.getElementById("moduleTabs");
  const singleIframe = document.getElementById("singleIframe");
  const singleHeader = document.getElementById("singleHeader");
  const btn = document.getElementById("viewModeToggle");

  if (!gridView || !singleView || !tabsEl || !singleIframe || !singleHeader || !btn) return;

  const ICON_GRID = `
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="2" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="11" y="2" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="2" y="11" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="11" y="11" width="5" height="5" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  `;

  const ICON_SINGLE = `
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <rect x="2" y="2" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="7" y1="2" x2="7" y2="16" stroke="currentColor" stroke-width="2"/>
      <line x1="11" y1="2" x2="11" y2="16" stroke="currentColor" stroke-width="2"/>
    </svg>
  `;

  function setViewMode(mode) {
    const isSingle = mode === "single";
    gridView.hidden = isSingle;
    singleView.hidden = !isSingle;
    btn.innerHTML = isSingle ? ICON_GRID : ICON_SINGLE; // icon represents the other view
    localStorage.setItem("rr_view_mode", isSingle ? "single" : "grid");
  }

  function setActiveModule(moduleId) {
    const m = MODULES.find(x => x.id === moduleId) || MODULES[0];

    tabsEl.querySelectorAll(".rr-tab").forEach(b => {
      b.setAttribute("aria-selected", b.dataset.moduleId === m.id ? "true" : "false");
    });

    singleHeader.textContent = m.label;
    if (singleIframe.getAttribute("src") !== m.src) {
      singleIframe.setAttribute("src", m.src);
    }

    localStorage.setItem("rr_active_module", m.id);
  }

  function buildTabs() {
    tabsEl.innerHTML = "";
    MODULES.forEach(m => {
      const b = document.createElement("button");
      b.className = "rr-tab";
      b.type = "button";
      b.textContent = m.label;
      b.dataset.moduleId = m.id;
      b.setAttribute("aria-selected", "false");
      b.addEventListener("click", () => setActiveModule(m.id));
      tabsEl.appendChild(b);
    });
  }

  buildTabs();

  const initialMode = localStorage.getItem("rr_view_mode") || "grid";
  setViewMode(initialMode);

  const initialModule = localStorage.getItem("rr_active_module") || MODULES[0].id;
  setActiveModule(initialModule);

  btn.addEventListener("click", () => {
    const current = localStorage.getItem("rr_view_mode") || "grid";
    setViewMode(current === "grid" ? "single" : "grid");
  });
})();
</script>

<script>
(() => {
  function isCadenceFrame(iframe) {
    const src = String(iframe.getAttribute("src") || "").toLowerCase();
    return src.includes("cadence.html");
  }

  function isVisibleFrame(iframe) {
    if (!iframe) return false;
    const rects = iframe.getClientRects();
    if (!rects || rects.length === 0) return false;
    const style = window.getComputedStyle(iframe);
    return style.display !== "none" && style.visibility !== "hidden";
  }

  function getCadenceFrames() {
    return Array.from(document.querySelectorAll("iframe")).filter((iframe) => {
      if (isCadenceFrame(iframe)) return true;
      try {
        return !!(iframe.contentWindow && typeof iframe.contentWindow.__rrTogglePlayPause === "function");
      } catch {
        return false;
      }
    });
  }

  function findActiveCadenceFrame() {
    const frames = getCadenceFrames();
    if (!frames.length) return null;

    const visible = frames.find((iframe) => isVisibleFrame(iframe));
    return visible || frames[0];
  }

  window.__rrGlobalCadenceToggle = function __rrGlobalCadenceToggle() {
    const iframe = findActiveCadenceFrame();
    if (!iframe) return false;

    try {
      const win = iframe.contentWindow;
      if (!win || !win.document) return false;

      const playBtn = win.document.getElementById("playBtn");
      if (playBtn && typeof playBtn.click === "function") {
        playBtn.click();
        return true;
      }

      if (typeof win.__rrTogglePlayPause === "function") {
        win.__rrTogglePlayPause();
        return true;
      }

      return false;
    } catch {
      return false;
    }
  };
})();
</script>

<script>
(() => {
  const WIN_BOUND_KEY = "__rrSpaceToCadenceBound";
  let handledSpaceDown = false;

  function isSpaceEvent(e) {
    return e.code === "Space" || e.key === " " || e.key === "Spacebar";
  }

  function blockEvent(e) {
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === "function") e.stopImmediatePropagation();
  }

  function onKeyDown(e) {
    if (!isSpaceEvent(e)) return;
    if (e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;

    blockEvent(e);
    handledSpaceDown = true;

    const activeEl = e.target && e.target.ownerDocument ? e.target.ownerDocument.activeElement : null;
    if (activeEl && typeof activeEl.blur === "function") {
      activeEl.blur();
    }

    if (!e.repeat && typeof window.__rrGlobalCadenceToggle === "function") {
      window.__rrGlobalCadenceToggle();
    }
  }

  function onKeyPress(e) {
    if (!isSpaceEvent(e) || !handledSpaceDown) return;
    blockEvent(e);
  }

  function onKeyUp(e) {
    if (!isSpaceEvent(e) || !handledSpaceDown) return;
    handledSpaceDown = false;
    blockEvent(e);
  }

  function bindWindow(win) {
    if (!win || win[WIN_BOUND_KEY]) return;
    win[WIN_BOUND_KEY] = true;
    try {
      win.addEventListener("keydown", onKeyDown, true);
      win.addEventListener("keypress", onKeyPress, true);
      win.addEventListener("keyup", onKeyUp, true);
    } catch {}
  }

  function bindIframe(iframe) {
    if (!iframe || iframe.dataset.rrSpaceToCadenceBound === "1") return;
    iframe.dataset.rrSpaceToCadenceBound = "1";

    const bindLoadedWindow = () => {
      try { bindWindow(iframe.contentWindow); } catch {}
    };

    iframe.addEventListener("load", bindLoadedWindow);
    bindLoadedWindow();
  }

  bindWindow(window);
  Array.from(document.querySelectorAll("iframe")).forEach(bindIframe);

  const mo = new MutationObserver(() => {
    Array.from(document.querySelectorAll("iframe")).forEach(bindIframe);
  });
  mo.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<script>
(() => {
  const EXTRA_BOTTOM_PX = 5;
  const MIN_IFRAME_HEIGHT = 500;
  const MAX_IFRAME_HEIGHT = 500;
  const MAX_COMPACT_IFRAME_HEIGHT = 500;
  const SINGLE_MIN_HEIGHT = 360;

  const iframes = () => Array.from(document.querySelectorAll('#gridView iframe'));
  const singleIframe = () => document.querySelector('#singleIframe');
  const naturalHeights = new WeakMap();
  let rafPending = false;

  const schedule = () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      resizeAndEqualize();
    });
  };

  const scheduleStabilized = () => {
    schedule();
    setTimeout(schedule, 80);
    setTimeout(schedule, 220);
    setTimeout(schedule, 500);
  };

  const safeNumber = (v, fallback) => (Number.isFinite(v) && v > 0 ? v : fallback);

  function measureSameOrigin(iframe) {
    try {
      const doc = iframe.contentDocument;
      if (!doc) return null;
      const body = doc.body;
      const de = doc.documentElement;
      if (!body || !de) return null;

      const h = Math.max(
        body.scrollHeight, de.scrollHeight,
        body.offsetHeight, de.offsetHeight,
        body.clientHeight, de.clientHeight
      );

      return Math.ceil(h + EXTRA_BOTTOM_PX);
    } catch {
      return null;
    }
  }

  function getNaturalHeight(iframe) {
    const sameOrigin = measureSameOrigin(iframe);
    if (sameOrigin !== null) {
      naturalHeights.set(iframe, sameOrigin);
      return sameOrigin;
    }
    const prev = naturalHeights.get(iframe);
    if (prev) return prev;
    const rect = iframe.getBoundingClientRect();
    return Math.max(100, Math.ceil(rect.height || 0));
  }

  function isCompactModule(iframe) {
    const src = (iframe.getAttribute("src") || "").toLowerCase();
    return src.includes("bassline.html")
      || src.includes("shaker.html")
      || src.includes("ride.html");
  }

  function groupByRow(iframeList) {
    const tolerance = 3;
    const rows = [];
    for (const iframe of iframeList) {
      const top = Math.round(iframe.getBoundingClientRect().top);
      let row = rows.find(r => Math.abs(r.top - top) <= tolerance);
      if (!row) {
        row = { top, items: [] };
        rows.push(row);
      }
      row.items.push(iframe);
    }
    rows.sort((a, b) => a.top - b.top);
    return rows;
  }

  function resizeAndEqualize() {
    const list = iframes();
    const activeSingle = singleIframe();
    if (!list.length && !activeSingle) return;

    const natural = new Map();
    for (const iframe of list) {
      iframe.setAttribute("scrolling", "no");
      natural.set(iframe, safeNumber(getNaturalHeight(iframe), MIN_IFRAME_HEIGHT));
    }

    const rows = groupByRow(list);
    for (const row of rows) {
      let maxH = MIN_IFRAME_HEIGHT;
      for (const iframe of row.items) {
        maxH = Math.max(maxH, safeNumber(natural.get(iframe), MIN_IFRAME_HEIGHT));
      }
      const targetH = Math.min(maxH, MAX_IFRAME_HEIGHT);
      for (const iframe of row.items) {
        const cap = isCompactModule(iframe) ? MAX_COMPACT_IFRAME_HEIGHT : MAX_IFRAME_HEIGHT;
        iframe.style.height = `${Math.min(targetH, cap)}px`;
      }
    }

    if (activeSingle) {
      activeSingle.setAttribute("scrolling", "no");
      const h = getNaturalHeight(activeSingle);
      activeSingle.style.height = `${Math.max(SINGLE_MIN_HEIGHT, h)}px`;
    }
  }

  window.addEventListener('resize', schedule, { passive: true });
  const root = document.documentElement;
  if (root) {
    const mo = new MutationObserver(schedule);
    mo.observe(root, { attributes: true, attributeFilter: ["class", "data-rr-theme"] });
  }
  const allFrames = () => Array.from(document.querySelectorAll("iframe"));
  allFrames().forEach((iframe) => {
    iframe.addEventListener("load", scheduleStabilized);
  });
  scheduleStabilized();
})();
</script>

</body>
</html>
