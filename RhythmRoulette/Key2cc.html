<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KeyToCC</title>
  <link rel="stylesheet" href="./rr-ui.css">
  <script src="./rr-ui.js" defer></script>
</head>
<body>

  <!-- Entire status header hidden -->
  <div class="status" style="display:none;">
    <div>
      <div class="small">Listening on BroadcastChannel('music-key')</div>
      <div class="small">Sends MIDI CC to Ableton Live via WebMIDI</div>
    </div>
    <div id="midiPill" class="pill warn">MIDI: initializing…</div>
  </div>

  <div class="grid">
    <div class="card">

      <div class="row">
        <label for="midiOutSelect">Output</label>
        <select id="midiOutSelect"></select>
      </div>

      <div class="row">
        <label for="midiChSelect">CH</label>
        <select id="midiChSelect"></select>
      </div>

      <div class="row">
        <label for="ccNumber">CC Number (0–127)</label>
        <input id="ccNumber" type="number" min="0" max="127" step="1" value="20" />
      </div>

      <div class="row">
        <label for="pitchCcNumber">Pitch CC (0–127)</label>
        <input id="pitchCcNumber" type="number" min="0" max="127" step="1" value="21" />
      </div>

      <!-- Hidden internal status elements -->
      <div style="display:none;">
        <div id="midiStatusText"></div>
        <div id="selectedOutText"></div>
        <div id="selectedChText"></div>
      </div>

    </div>

    <div class="card">

      <!-- Hidden monitoring UI -->
      <div style="display:none;">
        <div id="lastKeyText"></div>
        <div id="lastSentText"></div>
        <div id="lastErrorText"></div>
      </div>

      <div class="small" style="margin-bottom:8px;"><strong>Manual test</strong></div>

      <div class="row">
        <label for="manualKeySelect">Key</label>
        <select id="manualKeySelect"></select>
      </div>

      <div class="row">
        <label></label>
        <button id="sendNowBtn">Send Now</button>
      </div>

    </div>
  </div>

<script>
(() => {
"use strict";

const KEY_TO_VALUE = Object.freeze({
"C": 0,"C#": 10,"D": 26,"Eb": 37,"E": 46,"F": 57,
"F#": 67,"G": 84,"Ab": 92,"A": 106,"Bb": 116,"B": 127
});

//
// Pitch mapping: tonic → semitones (-6..+5) for Ableton "Pitch" knob
// F#:-6, G:-5, Ab/G#:-4, A:-3, Bb:-2, B:-1, C:0, C#:1, D:2, Eb/D#:3, E:4, F:5
//
const TONIC_TO_ST = Object.freeze({
  "F#": -6, "G": -5, "Ab": -4, "A": -3, "Bb": -2, "B": -1,
  "C": 0, "C#": 1, "D": 2, "Eb": 3, "E": 4, "F": 5
});

// Map semitones [-6..+5] to CC [0..127] (Ableton scales via MIDI mapping Min/Max)
const ST_MIN = -6, ST_MAX = 5;
function stToCC(st){
  const t = (st - ST_MIN) / (ST_MAX - ST_MIN); // 0..1
  return Math.max(0, Math.min(127, Math.round(t * 127)));
}

const UI_KEYS = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];

function normalizeTonic(t){
if(typeof t!=="string")return null;
t=t.trim();
if(!t)return null;
if(t==="G#")return"Ab";
if(t==="E♭")return"Eb";
if(t==="B♭")return"Bb";
if(t==="A♭")return"Ab";
if(t==="C♯")return"C#";
if(t==="F♯")return"F#";
if(t==="G♯")return"Ab";
return t;
}

const midiPill=document.getElementById("midiPill");
const midiStatusText=document.getElementById("midiStatusText");
const midiOutSelect=document.getElementById("midiOutSelect");
const midiChSelect=document.getElementById("midiChSelect");
const ccNumberInput=document.getElementById("ccNumber");
const pitchCcNumberInput=document.getElementById("pitchCcNumber");
const selectedOutText=document.getElementById("selectedOutText");
const selectedChText=document.getElementById("selectedChText");
const lastKeyText=document.getElementById("lastKeyText");
const lastSentText=document.getElementById("lastSentText");
const lastErrorText=document.getElementById("lastErrorText");
const manualKeySelect=document.getElementById("manualKeySelect");
const sendNowBtn=document.getElementById("sendNowBtn");

let midiAccess=null;
let selectedOutputId=null;
let lastSentKey=null;
let lastSentPitchKey=null;
let lastSentPitchValue=null;
let lastSentValue=null;

function setError(msg){ lastErrorText.textContent=msg||""; }
function setLastSent(cc,val){ lastSentText.textContent=(cc!=null&&val!=null)?`CC ${cc} → ${val}`:""; }

function getCcNumber(){
let n=Number(ccNumberInput.value);
if(!Number.isFinite(n))return null;
n=Math.max(0,Math.min(127,Math.round(n)));
ccNumberInput.value=String(n);
return n;
}

function getPitchCcNumber(){
  let n = Number(pitchCcNumberInput.value);
  if(!Number.isFinite(n)) return null;
  n = Math.max(0, Math.min(127, Math.round(n)));
  pitchCcNumberInput.value = String(n);
  return n;
}

function getChannel(){
let ch=Number(midiChSelect.value);
if(!Number.isFinite(ch)||ch<1||ch>16)return 1;
return ch;
}

function getSelectedOutput(){
if(!midiAccess)return null;
let id=midiOutSelect.value||selectedOutputId;
if(!id)return null;
return midiAccess.outputs.get(id)||null;
}

function populateChannels(){
midiChSelect.innerHTML="";
for(let i=1;i<=16;i++){
let o=document.createElement("option");
o.value=String(i);
o.textContent=String(i);
midiChSelect.appendChild(o);
}
midiChSelect.value="1";
}

function populateKeyDropdown(sel){
sel.innerHTML="";
UI_KEYS.forEach(k=>{
let o=document.createElement("option");
o.value=k;
o.textContent=k;
sel.appendChild(o);
});
sel.value="C";
}

function populateOutputs(){
if(!midiAccess)return;
let outputs=Array.from(midiAccess.outputs.values());
midiOutSelect.innerHTML="";
if(outputs.length===0){selectedOutputId=null;return;}
outputs.forEach(out=>{
let o=document.createElement("option");
o.value=out.id;
o.textContent=out.name||"Unnamed Output";
midiOutSelect.appendChild(o);
});
selectedOutputId=outputs[0].id;
midiOutSelect.value=selectedOutputId;
}

function sendPitchFromTonic(tonic,{force=false}={}){
  const st = TONIC_TO_ST[tonic];
  if(st==null) return;

  setError("");
  let out = getSelectedOutput();
  if(!out){ setError("No MIDI output selected/available."); return; }

  const cc = getPitchCcNumber();
  if(cc==null){ setError("Invalid Pitch CC number."); return; }

  const ch = getChannel();
  const val = stToCC(st);

  if(!force && lastSentPitchKey===tonic && lastSentPitchValue===val) return;

  const status = 0xB0 + (ch-1);
  try{
    out.send([status, cc & 0x7F, val & 0x7F]);
    lastSentPitchKey = tonic;
    lastSentPitchValue = val;
  }catch(e){
    setError(e.message || String(e));
  }
}

function sendMappedValue(val,tonic,{force=false}={}){
setError("");
let out=getSelectedOutput();
if(!out){setError("No MIDI output selected/available.");return;}
let cc=getCcNumber();
if(cc==null){setError("Invalid CC number.");return;}
let ch=getChannel();
if(!force&&lastSentKey===tonic&&lastSentValue===val)return;
let status=0xB0+(ch-1);
try{
out.send([status,cc&0x7F,val&0x7F]);
lastSentKey=tonic;
lastSentValue=val;
lastKeyText.textContent=tonic||"";
setLastSent(cc,val);
}catch(e){
setError(e.message||String(e));
}
}

function handleIncomingKey(raw){
let tonic=normalizeTonic(raw);
if(!tonic)return;
let mapped=KEY_TO_VALUE[tonic];
if(mapped==null)return;
sendMappedValue(mapped,tonic);
sendPitchFromTonic(tonic);
}

function initBroadcast(){
let bc=new BroadcastChannel("music-key");
bc.onmessage=(e)=>{
let msg=e.data;
if(!msg||msg.type!=="key")return;
handleIncomingKey(msg.tonic);
};
}

async function initMIDI(){
if(!navigator.requestMIDIAccess)return;
try{
midiAccess=await navigator.requestMIDIAccess({sysex:false});
midiAccess.onstatechange=populateOutputs;
populateOutputs();
}catch(e){}
}

midiOutSelect.addEventListener("change",()=>{
selectedOutputId=midiOutSelect.value||null;
});

sendNowBtn.addEventListener("click",()=>{
let tonic=normalizeTonic(manualKeySelect.value);
if(!tonic)return;
let mapped=KEY_TO_VALUE[tonic];
if(mapped==null)return;
sendMappedValue(mapped,tonic,{force:true});
sendPitchFromTonic(tonic,{force:true});
});

populateChannels();
populateKeyDropdown(manualKeySelect);
initBroadcast();
initMIDI();
})();
</script>
</body>
</html>
