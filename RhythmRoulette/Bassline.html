<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bassline v2 — Node Pattern + Key-Safe Pitch (internal-ticker)</title>
<style>
  :root{
    --ui-bg:#ffffff;
    --ui-fg:#000000;
    --ui-border:#000000;
    --ui-radius:10px;
    --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial;
    --ui-font-size:14px;
    --ui-line-height:1.25;
    --ui-pad-y:10px;
    --ui-pad-x:12px;
    --ui-gap:10px;
    --ui-page-pad:18px;
    --ui-max-width:100%;
  }

  html, body{
    margin:0;
    height:100%;
    background:var(--ui-bg);
    color:var(--ui-fg);
    font-family:var(--ui-font);
    font-size:var(--ui-font-size);
    line-height:var(--ui-line-height);
  }

  .wrap{
    max-width:var(--ui-max-width);
    padding:var(--ui-page-pad);
    margin:0 auto;
    display:grid;
    gap:var(--ui-gap);
  }

  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:var(--ui-gap);
    margin:0;
  }

  label{
    display:inline-block;
    color:var(--ui-fg);
  }

  select, button, input[type="number"]{
    background:var(--ui-bg);
    color:var(--ui-fg);
    border:1px solid var(--ui-border);
    border-radius:var(--ui-radius);
    padding:var(--ui-pad-y) var(--ui-pad-x);
    font:inherit;
    line-height:inherit;
    box-shadow:none;
    appearance:auto;
  }

  input[type="range"]{ accent-color: var(--ui-fg); }
  button{ cursor:pointer; user-select:none; }
  button:disabled, select:disabled{ opacity:.45; cursor:not-allowed; }

  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; }
  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--ui-border);
    font-size:12px;
  }
  .small{ font-size:12px; }
  .spacer{ flex: 1 1 auto; min-width: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <label for="midiIn">MIDI In</label>
      <select id="midiIn" aria-label="MIDI Input"></select>

      <label for="midiOut">MIDI Out</label>
      <select id="midiOut" aria-label="MIDI Output"></select>

      <button id="panicBtn">Panic</button>
      <span id="midiStatus" class="pill">MIDI: —</span>
      <span class="pill">Bass Ch <span class="mono">4</span></span>
    </div>

    <div class="row">

      <button id="randBtn">Randomize Pattern</button>
      <label for="patternLen">Pattern Length</label>
      <select id="patternLen" aria-label="Pattern Length">
        <option value="8">8</option>
        <option value="16">16</option>
        <option value="32">32</option>
      </select>
      <span class="pill">Len <span id="lenOut" class="mono">—</span></span>
      <span class="pill">Hits <span id="hitsOut" class="mono">—</span></span>
      <span class="pill">Tick <span id="tickOut" class="mono">—</span>/127</span>
      <span class="pill">BPM <span id="bpmOut" class="mono">—</span></span>
      <span class="pill">Sub <span id="subOut" class="mono">—</span></span>
    </div>

    <div class="row">
      <label for="pitchVar">Pitch Variation</label>
      <input id="pitchVar" type="range" min="0" max="100" value="50" />
      <span class="pill"><span id="pitchVarVal" class="mono">50</span>%</span>

      <label for="octJump">Octave Jump</label>
      <input id="octJump" type="range" min="0" max="100" value="0" />
      <span class="pill"><span id="octJumpVal" class="mono">0</span>%</span>

      <label for="legato">Legato</label>
      <input id="legato" type="range" min="0" max="100" value="70" />
      <span class="pill"><span id="legatoVal" class="mono">70</span>%</span>
    </div>

    <div class="row small">
      <span class="pill">Key <span id="keyOut" class="mono">—</span></span>
      <span class="pill">Chord <span id="chordOut" class="mono">[]</span></span>
      <span class="pill">Root <span id="rootOut" class="mono">—</span></span>
      <span class="pill">Last chord tick <span id="lastChordTickOut" class="mono">—</span></span>
      <span class="spacer"></span>
      <span id="debugOut" class="mono">—</span>
    </div>
  </div>

<script>
(() => {
  // =========================================================
  // Core Config
  // =========================================================
  const LOOP_TICKS = 128;      // incoming ticker loop
  const SUBDIV_FALLBACK = 4;   // 16ths per beat
  const BASS_MIDI_CH = 3;      // 0-based -> Channel 4
  const CHORD_CH = 0;          // 0-based -> Channel 1
  const ROOT_CH  = 1;          // 0-based -> Channel 2

  // Pattern density constraints
  const MIN_HIT_RATIO = 0.25;  // change to 0.20 if you prefer
  const MAX_HIT_RATIO = 0.50;

  // Bass register
  const BASS_LO = 36;          // C2
  const BASS_HI = 52;          // E3-ish

  // Timing clamps
  const NOTE_MS_MIN = 35;
  const NOTE_MS_MAX = 5000;

  // Octave jump repeat
  const OCT_JUMP_DELAY_TICKS = 2;
  const OCT_JUMP_DUR_TICKS = 1;

  // Chord attack debounce
  const CHORD_ATTACK_DEBOUNCE_MS = 20;

  // =========================================================
  // DOM
  // =========================================================
  const $ = (s) => document.querySelector(s);
  const el = {
    midiIn: $('#midiIn'),
    midiOut: $('#midiOut'),
    midiStatus: $('#midiStatus'),
    panicBtn: $('#panicBtn'),
    randBtn: $('#randBtn'),

    patternLen: $('#patternLen'),

    lenOut: $('#lenOut'),
    hitsOut: $('#hitsOut'),
    tickOut: $('#tickOut'),
    bpmOut: $('#bpmOut'),
    subOut: $('#subOut'),

    pitchVar: $('#pitchVar'),
    octJump: $('#octJump'),
    legato: $('#legato'),
    pitchVarVal: $('#pitchVarVal'),
    octJumpVal: $('#octJumpVal'),
    legatoVal: $('#legatoVal'),

    keyOut: $('#keyOut'),
    chordOut: $('#chordOut'),
    rootOut: $('#rootOut'),
    lastChordTickOut: $('#lastChordTickOut'),
    debugOut: $('#debugOut'),
  };

  // =========================================================
  // State
  // =========================================================
  const state = {
    // ticker
    lastTickCount: -1,
    lastTickAtMs: 0,
    bpm: 120,
    subdiv: SUBDIV_FALLBACK,

    // controls
    pitchVariation: 50,
    octaveJump: 0,
    legato: 70,

    // key
    hasKey: false,
    currentKeyPCSet: null,   // Set<int 0..11>
    currentKeyRootPc: null,
    currentScaleType: null,
    currentKeyLabel: '—',

    // chord (MIDI held)
    chordNotesSet: new Set(),  // absolute notes
    currentChordNotes: [],     // sorted absolute notes
    currentRootNote: -1,       // absolute note
    lastChordNotesSig: '',
    lastChordAttackSig: '',
    lastChordAttackMs: 0,
    lastChordChangeTick: null,

    // pattern
    pattern: makeEmptyPattern(16),

    // scheduled events keyed by global tick 0..127
    scheduled: new Map(), // Map<int, Array<{type:'octJump', note:number}>>

    // last note memory for smooth register choice
    lastBassNote: null,

    // strict mono note lifecycle
    activeNote: null,          // currently sounding MIDI note number (or null)
    activeOffTimer: null,      // timeout id for scheduled note-off (or null)

    // per-tick dedupe / arbitration
    tickRequests: new Map(),   // Map<int, {priority:number, fn:Function}>
    emittedTick: -1,           // last tick where a note was emitted
    emittedPriority: 0,        // priority of the note emitted on emittedTick
  };

  function makeEmptyPattern(len){
    return { len, steps: new Array(len).fill(null), seed: (Math.random()*0x7fffffff)|0 };
  }

  // =========================================================
  // MIDI
  // =========================================================
  const MIDI = {
    access: null,
    in: null,
    out: null,

    async init() {
      try {
        this.access = await navigator.requestMIDIAccess({ sysex:false });
        this.access.onstatechange = () => { this.refreshInputs(); this.refreshOutputs(); };
        this.refreshInputs();
        this.refreshOutputs();
        el.midiStatus.textContent = 'MIDI: ready';
      } catch (e) {
        el.midiStatus.textContent = 'MIDI: unavailable';
        console.warn('Web MIDI init failed', e);
      }
    },

    inputs() { return this.access ? Array.from(this.access.inputs.values()) : []; },
    outputs(){ return this.access ? Array.from(this.access.outputs.values()) : []; },

    refreshInputs() {
      const ins = this.inputs();
      const old = el.midiIn.value;
      el.midiIn.innerHTML = '';
      if (!ins.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no inputs)';
        el.midiIn.appendChild(opt);
        this.selectInById('');
        return;
      }
      ins.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.id;
        opt.textContent = i.name || i.manufacturer || i.id;
        el.midiIn.appendChild(opt);
      });
      const pick = ins.find(i => i.id === old) || ins[0];
      el.midiIn.value = pick.id;
      this.selectInById(pick.id);
    },

    refreshOutputs() {
      const outs = this.outputs();
      const old = el.midiOut.value;
      el.midiOut.innerHTML = '';
      if (!outs.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no outputs)';
        el.midiOut.appendChild(opt);
        this.selectOutById('');
        return;
      }
      outs.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.name || o.manufacturer || o.id;
        el.midiOut.appendChild(opt);
      });
      const pick = outs.find(o => o.id === old) || outs[0];
      el.midiOut.value = pick.id;
      this.selectOutById(pick.id);
    },

    selectInById(id) {
      if (this.in) this.in.onmidimessage = null;
      const ins = this.inputs();
      this.in = ins.find(i => i.id === id) || null;
      if (this.in) this.in.onmidimessage = onMIDIMessage;
    },

    selectOutById(id) {
      const outs = this.outputs();
      this.out = outs.find(o => o.id === id) || null;
    },

    send(bytes) { if (this.out) this.out.send(bytes); },

    noteOn(note, vel=96, ch=BASS_MIDI_CH) {
      this.send([0x90 + (ch & 0x0F), note & 0x7F, vel & 0x7F]);
    },
    noteOff(note, ch=BASS_MIDI_CH) {
      this.send([0x80 + (ch & 0x0F), note & 0x7F, 0]);
    },
    allNotesOff() {
      if (!this.out) return;
      for (let ch=0; ch<16; ch++) this.out.send([0xB0 + ch, 123, 0]);
      for (let n=0; n<128; n++) this.out.send([0x80 + (BASS_MIDI_CH & 0x0F), n, 0]);
    },
    allNotesOffChannel(ch) {
      if (!this.out) return;
      const c = (ch & 0x0F);
      this.out.send([0xB0 + c, 123, 0]);
      this.out.send([0xB0 + c, 120, 0]);
    }
  };

  function parseStatus(status) {
    const type = status & 0xF0;
    const ch = status & 0x0F;
    return { type, ch };
  }

  // Debounce chord recompute (MIDI messages can arrive clustered)
  let chordRecomputeTimer = null;
  function scheduleChordRecompute() {
    if (chordRecomputeTimer) clearTimeout(chordRecomputeTimer);
    chordRecomputeTimer = setTimeout(() => {
      chordRecomputeTimer = null;
      commitChordUpdate();
    }, 8);
  }

  function onMIDIMessage(ev) {
    const data = ev.data || [];
    if (data.length < 2) return;

    const { type, ch } = parseStatus(data[0]);
    const note = data[1] & 0x7F;
    const vel  = (data.length > 2) ? (data[2] & 0x7F) : 0;

    const isNoteOn  = (type === 0x90 && vel > 0);
    const isNoteOff = (type === 0x80) || (type === 0x90 && vel === 0);

    if (ch === CHORD_CH) {
      if (isNoteOn) state.chordNotesSet.add(note);
      else if (isNoteOff) state.chordNotesSet.delete(note);
      scheduleChordRecompute();
    } else if (ch === ROOT_CH) {
      if (isNoteOn) state.currentRootNote = note;
      else if (isNoteOff) { if (state.currentRootNote === note) state.currentRootNote = -1; }
      scheduleChordRecompute();
    }
  }

  function normalizeChordNotes(arr) {
    const uniq = Array.from(new Set(arr.map(n => n|0))).filter(n => n >= 0 && n <= 127);
    uniq.sort((a,b)=>a-b);
    return uniq;
  }

  function chordSignature(chordNotes, rootNote) {
    return `r:${rootNote}|c:${chordNotes.join(',')}`;
  }

  function commitChordUpdate() {
    const chordNotes = normalizeChordNotes(Array.from(state.chordNotesSet));
    state.currentChordNotes = chordNotes;

    if (state.currentRootNote < 0 && chordNotes.length) state.currentRootNote = chordNotes[0];

    const chordNotesSig = chordNotes.join(',');
    const chordChanged = (chordNotesSig !== state.lastChordNotesSig);

    if (chordChanged) {
      state.lastChordNotesSig = chordNotesSig;
      const t = state.lastTickCount;
      if (t >= 0) state.lastChordChangeTick = t;

      renderChordUI();

      // Immediate chord-change attack note (independent of pattern)
      chordChangeAttack();
    } else {
      renderChordUI();
    }
  }

  function chordChangeAttack() {
    const chord = state.currentChordNotes || [];
    if (!chord.length) return;
    if (!MIDI.out) return;

    const sig = chordSignature(chord, state.currentRootNote);
    const now = performance.now();
    if (state.lastChordAttackSig === sig && (now - (state.lastChordAttackMs||0)) < CHORD_ATTACK_DEBOUNCE_MS) return;
    state.lastChordAttackSig = sig;
    state.lastChordAttackMs = now;

    const globalTick = (state.lastTickCount >= 0) ? state.lastTickCount : 0;
    requestBassNote(globalTick, 3, () => triggerBassEventNow(globalTick, null, 'chordChange'));
    // Emit immediately (and override anything already emitted on this tick).
    flushBassRequestForTick(globalTick, true);
    el.debugOut.textContent = `attack @${globalTick}`;
  }

  // =========================================================
  // Key / scale feed (BroadcastChannel: music-key)
  // =========================================================
  const KEY_BC_NAME = 'music-key';
  function initKeyBC() {
    const bc = new BroadcastChannel(KEY_BC_NAME);
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (!m || typeof m !== 'object') return;

      const parsed = parseKeyMessage(m);
      if (!parsed) return;

      state.currentKeyRootPc = parsed.root;
      state.currentScaleType = parsed.scaleType;
      state.currentKeyPCSet = parsed.pcSet;
      state.hasKey = !!(parsed.pcSet && parsed.pcSet.size);
      state.currentKeyLabel = parsed.label || '—';
      renderKeyUI();
    };
  }

  function parseKeyMessage(m) {
    const type = (typeof m.type === 'string') ? m.type.toLowerCase() : '';
    const isKeyMsg = (type === 'key') || (type.includes('key') && ('tonic' in m || 'tonicPc' in m || 'mode' in m));
    if (!isKeyMsg) {
      const mightBeKey = type.includes('key') || type.includes('scale') || ('key' in m) || ('scale' in m) || ('pcSet' in m) || ('pitchClasses' in m) || ('tonicPc' in m) || ('mode' in m);
      if (!mightBeKey) return null;
    }

    const pcsArr = Array.isArray(m.pcSet) ? m.pcSet
      : Array.isArray(m.pitchClasses) ? m.pitchClasses
      : Array.isArray(m.scalePCs) ? m.scalePCs
      : Array.isArray(m.pcs) ? m.pcs
      : null;

    if (pcsArr && pcsArr.length) {
      const pcSet = new Set(pcsArr.map(x => ((x|0) % 12 + 12) % 12));
      const root = extractKeyRoot(m);
      const scaleType = extractScaleType(m);
      const label = buildKeyLabel(m, root, scaleType);
      return { root, scaleType, pcSet, label };
    }

    if (typeof m.key === 'string') {
      const out = parseKeyString(m.key);
      if (out) return out;
    }

    const root = extractKeyRoot(m);
    const scaleType = extractScaleType(m);
    if (root == null || !scaleType) return null;

    const pcSet = buildScalePCSet(root, scaleType);
    if (!pcSet || !pcSet.size) return null;

    const label = buildKeyLabel(m, root, scaleType);
    return { root, scaleType, pcSet, label };
  }

  function buildKeyLabel(m, rootPc, scaleType) {
    let tonicName = null;
    if (typeof m.tonic === 'string' && m.tonic.trim()) tonicName = m.tonic.trim();
    if (!tonicName && rootPc != null) tonicName = pcToNoteName(rootPc);
    const mode = (typeof m.mode === 'string' && m.mode.trim()) ? m.mode.trim().toLowerCase()
               : (scaleType ? String(scaleType).trim().toLowerCase().replace(/_/g,' ') : '');
    if (!tonicName) return '—';
    if (!mode) return tonicName;
    return `${tonicName} ${mode}`;
  }

  function pcToNoteName(pc) {
    const names = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
    return names[((pc|0)%12+12)%12] || 'C';
  }

  function extractKeyRoot(m) {
    const numCand = (
      (typeof m.root === 'number' ? m.root : null) ??
      (typeof m.tonicPc === 'number' ? m.tonicPc : null) ??
      (typeof m.tonicMidi === 'number' ? m.tonicMidi : null) ??
      (typeof m.tonic === 'number' ? m.tonic : null) ??
      (typeof m.keyRoot === 'number' ? m.keyRoot : null) ??
      (typeof m.rootNote === 'number' ? m.rootNote : null) ??
      (typeof m.rootMidi === 'number' ? m.rootMidi : null)
    );
    if (numCand != null) {
      const n = numCand|0;
      return ((n % 12) + 12) % 12;
    }

    if (typeof m.tonic === 'string') {
      const pc = noteNameToPc(String(m.tonic).trim());
      if (pc != null) return pc;
    }
    if (typeof m.rootName === 'string') {
      const pc = noteNameToPc(String(m.rootName).trim());
      if (pc != null) return pc;
    }
    return null;
  }

  function extractScaleType(m) {
    const s = (
      (typeof m.scaleType === 'string' ? m.scaleType : null) ??
      (typeof m.scale === 'string' ? m.scale : null) ??
      (typeof m.mode === 'string' ? m.mode : null) ??
      (typeof m.quality === 'string' ? m.quality : null)
    );
    if (!s) return null;
    return String(s).trim().toLowerCase().replace(/\s+/g,'_');
  }

  function parseKeyString(str) {
    const s = String(str).trim();
    const mm = s.match(/^([A-Ga-g])\s*([#b]?)(?:\s+|$)(.*)$/);
    if (!mm) return null;
    const letter = mm[1].toUpperCase();
    const accidental = mm[2] || '';
    const rest = (mm[3] || '').trim().toLowerCase();
    const rootPc = noteNameToPc(letter + accidental);
    if (rootPc == null) return null;
    const scaleType = rest ? rest.replace(/\s+/g,'_') : 'major';
    const pcSet = buildScalePCSet(rootPc, scaleType);
    if (!pcSet || !pcSet.size) return null;
    return { root: rootPc, scaleType, pcSet, label: `${letter+accidental} ${scaleType.replace(/_/g,' ')}` };
  }

  function noteNameToPc(name) {
    const map = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
    const L = name[0]?.toUpperCase();
    if (!map.hasOwnProperty(L)) return null;
    let pc = map[L];
    if (name.includes('#')) pc += 1;
    if (name.includes('b')) pc -= 1;
    return ((pc % 12) + 12) % 12;
  }

  function buildScalePCSet(rootPc, scaleType) {
    const r = ((rootPc|0) % 12 + 12) % 12;
    const type = String(scaleType || '').toLowerCase();
    const patterns = {
      major:            [0,2,4,5,7,9,11],
      minor:            [0,2,3,5,7,8,10],
      natural_minor:    [0,2,3,5,7,8,10],
      harmonic_minor:   [0,2,3,5,7,8,11],
      melodic_minor:    [0,2,3,5,7,9,11],
      dorian:           [0,2,3,5,7,9,10],
      phrygian:         [0,1,3,5,7,8,10],
      lydian:           [0,2,4,6,7,9,11],
      mixolydian:       [0,2,4,5,7,9,10],
      locrian:          [0,1,3,5,6,8,10],
    };
    const pat = patterns[type] || patterns[type.replace(/^ionian$/,'major')] || patterns[type.replace(/^aeolian$/,'minor')];
    if (!pat) return null;
    return new Set(pat.map(x => (r + x) % 12));
  }

  function renderKeyUI() {
    el.keyOut.textContent = state.hasKey ? (state.currentKeyLabel || '—') : '—';
  }

  // =========================================================
  // Ticker (BroadcastChannel: internal-ticker)
  // =========================================================
  function initTicker() {
    const bc = new BroadcastChannel('internal-ticker');
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (!m) return;

      if (m.type === 'tick') onTick(m);
      else if ((m.type === 'transport' && (m.state === 'stopped' || m.play === false)) || m.type === 'stop') {
        panic('transport stop');
      }
    };
  }

  function onTick(msg) {
    const t = (msg.count|0) % LOOP_TICKS;
    state.lastTickCount = t;
    state.lastTickAtMs = performance.now();

    if (typeof msg.bpm === 'number' && msg.bpm > 0) state.bpm = msg.bpm;
    if (typeof msg.subdiv === 'number' && msg.subdiv > 0) state.subdiv = msg.subdiv;

    renderTickUI(t);

    // 1) Run scheduled octave jumps for this tick (enqueue, do not emit directly)
    runScheduledForTick(t);

    // 2) Pattern playback (enqueue)
    const p = (state.pattern.len > 0) ? (t % state.pattern.len) : 0;
    const step = state.pattern.steps[p];
    if (step && step.on) {
      requestBassNote(t, 2, () => triggerBassEventNow(t, p, 'pattern'));
    }

    // 3) Emit at most one note for this tick (strict mono + hard de-dupe)
    flushBassRequestForTick(t, false);
  }

  function renderTickUI(t) {
    el.tickOut.textContent = String(t);
    el.bpmOut.textContent = String((state.bpm|0) || 120);
    el.subOut.textContent = String((state.subdiv|0) || SUBDIV_FALLBACK);
    el.lastChordTickOut.textContent = (state.lastChordChangeTick == null) ? '—' : String(state.lastChordChangeTick);
  }

  function tickMs() {
    const bpm = (state.bpm && state.bpm > 0) ? state.bpm : 120;
    const subdiv = (state.subdiv && state.subdiv > 0) ? state.subdiv : SUBDIV_FALLBACK;
    return 60000 / (bpm * subdiv);
  }

  // =========================================================
  // Pattern Generation
  // =========================================================
  function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
  function choice(arr){ return arr[(Math.random() * arr.length) | 0]; }
  function randint(a, b){ return a + ((Math.random() * (b - a + 1)) | 0); }

  function buildWeights(len) {
    const w = new Array(len).fill(1);
    for (let i=0; i<len; i++) {
      const in16 = i % 16;
      let ww = 1;
      if (in16 === 0) ww += 5;
      if (in16 === 8) ww += 3;
      if (in16 === 4 || in16 === 12) ww += 2;
      if (in16 % 2 === 0) ww += 1;
      if (in16 % 2 === 1) ww -= 0.25;
      w[i] = Math.max(0.1, ww);
    }
    return w;
  }

  function weightedPickIndex(weights) {
    let sum = 0;
    for (const ww of weights) sum += Math.max(0, ww);
    if (sum <= 0) return 0;
    let r = Math.random() * sum;
    for (let i=0; i<weights.length; i++){
      r -= Math.max(0, weights[i]);
      if (r <= 0) return i;
    }
    return weights.length - 1;
  }

  function randomizePattern(forceLen=null) {
    const lengths = [8, 16, 32];
    const len = (forceLen != null && lengths.includes(forceLen|0)) ? (forceLen|0) : choice(lengths);

    // Keep the dropdown in sync with the active pattern length
    if (el.patternLen) el.patternLen.value = String(len);

    const minHits = Math.ceil(MIN_HIT_RATIO * len);
    const maxHits = Math.floor(MAX_HIT_RATIO * len);
    const hitCount = randint(minHits, Math.max(minHits, maxHits));

    const weights = buildWeights(len);

    const picked = new Set();
    let guard = 0;
    while (picked.size < hitCount && guard++ < 5000) {
      const idx = weightedPickIndex(weights);
      picked.add(idx);
    }

    const steps = new Array(len).fill(null);
    for (const p of picked) {
      steps[p] = { on:true, rA: Math.random(), rB: Math.random() };
    }

    state.pattern = { len, steps, seed: ((Math.random()*0x7fffffff)|0) ^ (Date.now()|0) };
    state.scheduled.clear(); // reset octave-jump queue on new pattern
    state.lastBassNote = null;

    el.lenOut.textContent = String(len);
    el.hitsOut.textContent = String(picked.size);
    el.debugOut.textContent = `pattern len=${len} hits=${picked.size}`;
  }

  // =========================================================
  // Harmony helpers
  // =========================================================
  function chordPCSet() {
    const chord = state.currentChordNotes || [];
    const pcs = new Set();
    for (const n of chord) pcs.add(((n|0) % 12 + 12) % 12);
    return pcs;
  }

  function getRootAbs() {
    const chord = state.currentChordNotes || [];
    if (state.currentRootNote >= 0) return state.currentRootNote|0;
    if (chord.length) return chord[0]|0;
    return -1;
  }

  function getEffectiveKeyPCSet(chordPcsMaybe=null) {
    if (state.hasKey && state.currentKeyPCSet && state.currentKeyPCSet.size) return state.currentKeyPCSet;
    // fallback: if no key, use chord pcs as a temporary "key"
    if (chordPcsMaybe && chordPcsMaybe.size) return chordPcsMaybe;
    return null;
  }

  // =========================================================
  // Pitch selection (Pitch Variation)
  // =========================================================
  function smoothstep01(t) {
    const x = clamp(t, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function pcListFromSet(set) {
    return Array.from(set || []).map(x=>x|0).sort((a,b)=>a-b);
  }

  function pickFromList(list, r) {
    if (!list || !list.length) return null;
    const idx = Math.min(list.length - 1, Math.max(0, Math.floor(clamp(r,0,0.999999) * list.length)));
    return list[idx]|0;
  }

  function choosePitchClass(source, stepRandA=0.5, stepRandB=0.5) {
    const chord = state.currentChordNotes || [];
    const rootAbs = getRootAbs();
    if (!chord.length || rootAbs < 0) return null;

    const rootPc = ((rootAbs|0)%12+12)%12;
    const chordPcs = chordPCSet();
    const keyPcs = getEffectiveKeyPCSet(chordPcs);
    if (!keyPcs || !keyPcs.size) return null;

    // Pools (PC sets)
    const chordInKey = new Set();
    for (const pc of chordPcs) if (keyPcs.has(pc)) chordInKey.add(pc);
    if (!chordInKey.size) chordInKey.add(rootPc); // ensure root exists

    const chordOther = new Set();
    for (const pc of chordInKey) if (pc !== rootPc) chordOther.add(pc);

    const scaleOnly = new Set();
    for (const pc of keyPcs) if (!chordPcs.has(pc)) scaleOnly.add(pc);

    const v = clamp((state.pitchVariation|0) / 100, 0, 1);
    const tChord = smoothstep01(clamp(v / 0.5, 0, 1));          // 0..1 over 0..50%
    const tScale = smoothstep01(clamp((v - 0.5) / 0.5, 0, 1));  // 0..1 over 50..100%

    // Chord-change attack: chord tones only (prefer root strongly)
    if (source === 'chordChange') {
      const chordChoices = pcListFromSet(chordInKey);
      // strong root preference: 75% root, 25% other chord tones (if any)
      if (Math.random() < 0.75 || chordChoices.length === 1) return rootPc;
      const others = chordChoices.filter(pc => pc !== rootPc);
      return pickFromList(others.length ? others : chordChoices, stepRandB);
    }

    // At 0%: root only
    if (v <= 0) return rootPc;

    // Category weights
    let wRoot = 1.0;
    let wChordOther = chordOther.size ? (1.0 * tChord) : 0.0;
    let wScaleOnly  = scaleOnly.size  ? (1.0 * tScale) : 0.0;

    // Normalize and pick
    const sum = Math.max(1e-9, wRoot + wChordOther + wScaleOnly);
    const x = clamp(stepRandA, 0, 0.999999) * sum;

    if (x < wRoot || (!wChordOther && !wScaleOnly)) {
      return rootPc;
    } else if (x < (wRoot + wChordOther) || !wScaleOnly) {
      const list = pcListFromSet(chordOther);
      return pickFromList(list, stepRandB) ?? rootPc;
    } else {
      const list = pcListFromSet(scaleOnly);
      const pc = pickFromList(list, stepRandB);
      return (pc == null) ? rootPc : pc;
    }
  }

  function bestMidiNoteForPc(targetPc, referenceMidi) {
    // Build candidates of targetPc within register [BASS_LO..BASS_HI] and choose closest to referenceMidi
    const pcs = ((targetPc|0)%12+12)%12;
    const candidates = [];
    for (let n = BASS_LO; n <= BASS_HI; n++) {
      if ((((n%12)+12)%12) === pcs) candidates.push(n);
    }
    if (!candidates.length) return clamp(referenceMidi|0, BASS_LO, BASS_HI);

    let best = candidates[0];
    let bestDist = Math.abs(best - referenceMidi);
    for (const c of candidates) {
      const d = Math.abs(c - referenceMidi);
      if (d < bestDist) { bestDist = d; best = c; }
    }
    return best|0;
  }

  // =========================================================
  // Legato (duration)
  // =========================================================
  function probabilityLong() {
    const L = clamp((state.legato|0) / 100, 0, 1);
    return 0.25 + 0.75 * L; // 0.25 at min, 1.0 at max
  }

  function ticksUntilNextPatternHit(fromGlobalTick) {
    const len = state.pattern.len|0;
    if (!len) return 4;
    const fromPos = fromGlobalTick % len;
    for (let i=1; i<=len; i++) {
      const p = (fromPos + i) % len;
      if (state.pattern.steps[p] && state.pattern.steps[p].on) return i;
    }
    return len;
  }

  function computeDurationTicks(source, fromGlobalTick) {
    // Octave jump repeat is always short
    if (source === 'octJump') return OCT_JUMP_DUR_TICKS;

    const lenToNext = ticksUntilNextPatternHit(fromGlobalTick);
    const L = clamp((state.legato|0) / 100, 0, 1);
    const pLong = probabilityLong();

    const isLong = (Math.random() < pLong) || (L >= 0.999);
    if (isLong) {
      const frac = (0.70 + (0.25 * L)); // 0.70..0.95
      const dur = Math.round(clamp(lenToNext * frac, 1, lenToNext));
      return Math.max(1, dur|0);
    } else {
      const opts = [1,1,2,2,3];
      const dur = opts[(Math.random()*opts.length)|0];
      return clamp(dur|0, 1, Math.max(1, lenToNext));
    }
  }

  function durationMsFromTicks(durTicks) {
    const ms = tickMs() * Math.max(1, durTicks|0);
    return clamp(ms, NOTE_MS_MIN, NOTE_MS_MAX);
  }

  // =========================================================
  // Octave jump scheduling
  // =========================================================
  function scheduleOctaveJump(globalTick, baseNote) {
    const p = clamp((state.octaveJump|0) / 100, 0, 1);
    if (p <= 0) return;
    if (Math.random() > p) return;

    const when = (globalTick + OCT_JUMP_DELAY_TICKS) % LOOP_TICKS;
    const note = clamp((baseNote|0) + 12, 0, 127);

    const arr = state.scheduled.get(when) || [];
    arr.push({ type:'octJump', note });
    state.scheduled.set(when, arr);
  }

  function runScheduledForTick(globalTick) {
    const arr = state.scheduled.get(globalTick);
    if (!arr || !arr.length) return;
    state.scheduled.delete(globalTick);

    for (const ev of arr) {
      if (ev.type === 'octJump') {
        requestBassNote(globalTick, 1, () => triggerSpecificNoteNow(globalTick, ev.note|0, 'octJump'));
      }
    }
  }

  // =========================================================
  // Note triggering + MIDI note lifecycle
  // =========================================================

  // Safety epsilon so Note Off always lands slightly before the next Note On
  const NOTE_OFF_EPS_MS = 4;

  function requestBassNote(globalTick, priority, fn) {
    // Hard de-dupe: keep highest priority request for this tick.
    const t = (globalTick|0) % LOOP_TICKS;
    const cur = state.tickRequests.get(t);
    if (!cur || priority > cur.priority) {
      state.tickRequests.set(t, { priority, fn });
    }
  }

  function flushBassRequestForTick(globalTick, force) {
    const t = (globalTick|0) % LOOP_TICKS;
    const req = state.tickRequests.get(t);
    if (!req) return;

    // If not forcing, don't emit twice for the same tick.
    if (!force && state.emittedTick === t) return;

    state.tickRequests.delete(t);

    // Emit exactly one note
    state.emittedTick = t;
    state.emittedPriority = req.priority;

    req.fn();
  }

  function clearActiveOffTimer() {
    if (state.activeOffTimer != null) {
      try { clearTimeout(state.activeOffTimer); } catch {}
      state.activeOffTimer = null;
    }
  }

  function stopCurrentBassNote() {
    if (!MIDI.out) return;

    clearActiveOffTimer();

    if (state.activeNote != null) {
      const n = state.activeNote|0;
      // Ensure the previous note is definitely stopped before starting the next one.
      MIDI.noteOff(n, BASS_MIDI_CH);
      // Extra safety: force silent state on that channel (prevents stuck overlaps in some synths)
      MIDI.allNotesOffChannel(BASS_MIDI_CH);
      state.activeNote = null;
    } else {
      // Still safe to send a channel flush if something external got stuck
      MIDI.allNotesOffChannel(BASS_MIDI_CH);
    }
  }

  function noteOnMono(note, vel, durMs) {
    if (!MIDI.out) return;

    // STRICT MONO: always stop previous note fully before any new Note On.
    stopCurrentBassNote();

    // Start new note
    MIDI.noteOn(note, vel, BASS_MIDI_CH);
    state.activeNote = note|0;

    // Schedule Note Off with epsilon to avoid micro-overlaps
    const offMs = Math.max(0, (durMs|0) - NOTE_OFF_EPS_MS);
    state.activeOffTimer = setTimeout(() => {
      // Only turn off if this is still the active note
      if (state.activeNote === (note|0)) {
        MIDI.noteOff(note, BASS_MIDI_CH);
        state.activeNote = null;
      }
      state.activeOffTimer = null;
    }, offMs);
  }

  function triggerSpecificNoteNow(globalTick, note, source) {
    if (!MIDI.out) return;

    const durTicks = computeDurationTicks(source, globalTick);
    const durMs = durationMsFromTicks(durTicks);

    // Octave jump should be short and light
    const vel = (source === 'octJump') ? 70 : 96;

    noteOnMono(note|0, vel, durMs);
    state.lastBassNote = note|0;

    el.debugOut.textContent = `${source} note=${note} dur=${durTicks}t`;
  }

  function triggerBassEventNow(globalTick, patternPos, source) {
    const chord = state.currentChordNotes || [];
    if (!chord.length) return;

    const chordPcs = chordPCSet();
    const keyPcs = getEffectiveKeyPCSet(chordPcs);
    if (!keyPcs || !keyPcs.size) return;

    const rootAbs = getRootAbs();
    if (rootAbs < 0) return;

    const step = (patternPos != null && state.pattern.steps[patternPos]) ? state.pattern.steps[patternPos] : null;
    const rA = step ? (step.rA ?? Math.random()) : Math.random();
    const rB = step ? (step.rB ?? Math.random()) : Math.random();

    const chosenPc = choosePitchClass(source, rA, rB);
    if (chosenPc == null) return;

    // Reference for register choice
    const ref = (state.lastBassNote != null)
      ? state.lastBassNote
      : bestMidiNoteForPc(((rootAbs|0)%12+12)%12, clamp(rootAbs, BASS_LO, BASS_HI));

    const note = bestMidiNoteForPc(chosenPc, ref);

    // Fire the main note (strict mono)
    triggerSpecificNoteNow(globalTick, note, source);

    // Schedule octave jump repeat (only for main notes, not for octJump events)
    if (source !== 'octJump') scheduleOctaveJump(globalTick, note);
  }

  // =========================================================
  // UI Render
  // =========================================================
  function renderChordUI() {
    el.chordOut.textContent = JSON.stringify((state.currentChordNotes || []).map(n=>n|0));
    const root = getRootAbs();
    el.rootOut.textContent = (root >= 0) ? String(root) : '—';
  }

  function syncSliders() {
    state.pitchVariation = clamp(parseInt(el.pitchVar.value,10)||0, 0, 100);
    state.octaveJump = clamp(parseInt(el.octJump.value,10)||0, 0, 100);
    state.legato = clamp(parseInt(el.legato.value,10)||0, 0, 100);

    el.pitchVarVal.textContent = String(state.pitchVariation|0);
    el.octJumpVal.textContent = String(state.octaveJump|0);
    el.legatoVal.textContent = String(state.legato|0);
  }

  // =========================================================
  // BroadcastChannel-triggered randomization (randomize_channel)
  // =========================================================
  function initRandomizeBC() {
    const randomizeChannel = new BroadcastChannel('randomize_channel');
    randomizeChannel.onmessage = (event) => {
      const d = event ? event.data : null;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'randomize_all') {
        console.log("Message 'randomize_all' reçu !");
        // 1) Trigger existing Randomize Pattern behavior via real button click
        if (el.randBtn) el.randBtn.click();

        // 2) Randomize sliders exactly like user input (value + input event)
        const sliders = [el.pitchVar, el.octJump, el.legato];
        for (const s of sliders) {
          if (!s) continue;
          const v = randint(0, 100);
          s.value = String(v);
          s.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }
    };
  }

  // =========================================================
  // Panic / safety
  // =========================================================
  function panic(reason='panic') {
    // clear current mono note
    try { stopCurrentBassNote(); } catch {}
    try { MIDI.allNotesOffChannel(BASS_MIDI_CH); } catch {}
    try { MIDI.allNotesOff(); } catch {}
    state.scheduled.clear();
    el.debugOut.textContent = `PANIC: ${reason}`;
  }

  // Ticker silence guard
  setInterval(() => {
    if (state.lastTickCount < 0) return;
    const now = performance.now();
    const msPerTick = tickMs();
    const timeout = Math.max(350, msPerTick * 8);
    if ((now - state.lastTickAtMs) > timeout) {
      panic('ticks stopped');
      state.lastTickCount = -1; // prevent repeated panic spam
    }
  }, 150);

  // =========================================================
  // Wire UI events
  // =========================================================
  el.midiIn.addEventListener('change', () => MIDI.selectInById(el.midiIn.value));
  el.midiOut.addEventListener('change', () => MIDI.selectOutById(el.midiOut.value));
  el.panicBtn.addEventListener('click', () => panic('button'));
  el.randBtn.addEventListener('click', () => randomizePattern());

  el.patternLen.addEventListener('change', () => {
    const len = parseInt(el.patternLen.value, 10);
    if (!Number.isFinite(len)) return;
    randomizePattern(len);
  });

  el.pitchVar.addEventListener('input', () => syncSliders());
  el.octJump.addEventListener('input', () => syncSliders());
  el.legato.addEventListener('input', () => syncSliders());

  // =========================================================
  // Init
  // =========================================================
  function init() {
    syncSliders();
    initKeyBC();
    initTicker();
    initRandomizeBC();
    MIDI.init();

    // start with a pattern immediately
    if (el.patternLen) el.patternLen.value = '16';
    randomizePattern(16);
    renderKeyUI();
    renderChordUI();
  }

  init();
})();
</script>
</body>
</html>
