<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bassline — Chord-Safe Generator (ticks via internal-ticker)</title>
<style>
  :root{
    --ui-bg:#ffffff;
    --ui-fg:#000000;
    --ui-border:#000000;
    --ui-radius:10px;
    --ui-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial;
    --ui-font-size:14px;
    --ui-line-height:1.25;
    --ui-pad-y:10px;
    --ui-pad-x:12px;
    --ui-gap:10px;
    --ui-page-pad:18px;
    --ui-max-width:100%;
  }

  html, body{
    margin:0;
    height:100%;
    background:var(--ui-bg);
    color:var(--ui-fg);
    font-family:var(--ui-font);
    font-size:var(--ui-font-size);
    line-height:var(--ui-line-height);
  }

  .wrap{
    max-width:var(--ui-max-width);
    padding:var(--ui-page-pad);
    margin:0 auto;
    display:grid;
    gap:var(--ui-gap);
  }

  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:var(--ui-gap);
    margin:0;
  }

  label{
    display:inline-block;
    color:var(--ui-fg);
  }

  select, button, input[type="number"]{
    background:var(--ui-bg);
    color:var(--ui-fg);
    border:1px solid var(--ui-border);
    border-radius:var(--ui-radius);
    padding:var(--ui-pad-y) var(--ui-pad-x);
    font:inherit;
    line-height:inherit;
    box-shadow:none;
    appearance:auto;
  }

  button{ cursor:pointer; user-select:none; }
  button:disabled, select:disabled{ opacity:.45; cursor:not-allowed; }

  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; }
  .pill{
    display:inline-block;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--ui-border);
    font-size:12px;
  }
  .small{ font-size:12px; }

  input[type="range"]{
    accent-color: var(--ui-fg);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <label for="midiIn">MIDI In</label>
      <select id="midiIn" aria-label="MIDI Input"></select>

      <label for="midiOut">MIDI Out</label>
      <select id="midiOut" aria-label="MIDI Output"></select>

      <button id="panicBtn">Panic</button>
      <span id="midiStatus" class="pill">MIDI: —</span>
      <span class="pill">Bass Ch 4</span>
    </div>

    <div class="row">
      <button id="genBtn">Generate Bassline</button>
      <span class="pill">Pattern len: <span id="patLenOut" class="mono">—</span></span>
      <span class="pill">Density: <span id="densityOut" class="mono">—</span></span>
      <span class="pill">Mode: <span id="srcModeOut" class="mono">MIDI Chords + Key BC</span></span>
      <button id="toggleSrcBtn" class="small" disabled>Toggle Chord Source</button>
    </div>

    <div class="row">
      <label for="legatoSlider">Legato</label>
      <input id="legatoSlider" type="range" min="0" max="100" value="70" />
      <span class="pill"> <span id="legatoVal" class="mono">70</span></span>

      <label for="distanceSlider">Distance</label>
      <input id="distanceSlider" type="range" min="0" max="100" value="0" />
      <span class="pill"> <span id="distanceVal" class="mono">0</span></span>

      <label for="densitySlider">Density</label>
      <input id="densitySlider" type="range" min="0" max="100" value="40" />
      <span class="pill"> <span id="densityVal" class="mono">40</span></span>
    </div>

    <div class="row small">
      <span class="pill">tick <span id="tickOut" class="mono">—</span>/127</span>
      <span class="pill">bpm <span id="bpmOut" class="mono">—</span></span>
      <span class="pill">subdiv <span id="subdivOut" class="mono">—</span></span>
      <span class="pill">Key <span id="keyOut" class="mono">—</span></span>
      <span class="pill">Chord <span id="chordOut" class="mono">[]</span></span>
      <span class="pill">Root <span id="rootOut" class="mono">—</span></span>
      <span class="pill">Last chord tick <span id="lastChordTickOut" class="mono">—</span></span>
    </div>

    <div class="row small">
      <span class="mono" id="noteDebug">—</span>
    </div>
  </div>

<script>
(() => {
  // =========================================================
  // Config
  // =========================================================
  const LOOP_TICKS = 128;             // Cadence loop length (0..127)
  const BASS_MIDI_CH = 3;             // 0-based -> Channel 4
  const CHORD_CH = 0;                 // 0-based -> Channel 1 (chord tones)
  const ROOT_CH  = 1;                 // 0-based -> Channel 2 (root)
  const CHORD_BC_NAME = 'harmony-chords'; // Optional future BC chord feed

  // Key feed (from Harmony.html)
  const KEY_BC_NAME = 'music-key';

  // Note duration clamp (ms)
  const NOTE_MS_MIN = 70;
  const NOTE_MS_MAX = 5000;

  // Legato factor range: % of time until next hit (mapped from slider 0..100)
  const LEGATO_FACTOR_MIN = 0.30;
  const LEGATO_FACTOR_MAX = 0.99;

  // Bass register target base (NOTE: distance no longer affects register)
  const BASS_LO = 36; // C2
  const BASS_HI_BASE = 52; // E3 (roughly).

  // Note repetition bias
  const REUSE_PROB_BEFORE_TWO = 0.88;
  const REUSE_PROB_AFTER_TWO  = 0.68;

  // =========================================================
  // DOM
  // =========================================================
  const $ = (s) => document.querySelector(s);
  const el = {
    midiIn: $('#midiIn'),
    midiOut: $('#midiOut'),
    midiStatus: $('#midiStatus'),
    genBtn: $('#genBtn'),
    panicBtn: $('#panicBtn'),
    patLenOut: $('#patLenOut'),
    densityOut: $('#densityOut'),
    tickOut: $('#tickOut'),
    bpmOut: $('#bpmOut'),
    subdivOut: $('#subdivOut'),
    keyOut: $('#keyOut'),
    chordOut: $('#chordOut'),
    rootOut: $('#rootOut'),
    lastChordTickOut: $('#lastChordTickOut'),
    noteDebug: $('#noteDebug'),
    toggleSrcBtn: $('#toggleSrcBtn'),
    srcModeOut: $('#srcModeOut'),

    // Sliders
    legatoSlider: $('#legatoSlider'),
    distanceSlider: $('#distanceSlider'),
    densitySlider: $('#densitySlider'),
    legatoVal: $('#legatoVal'),
    distanceVal: $('#distanceVal'),
    densityVal: $('#densityVal'),
  };

  // =========================================================
  // State
  // =========================================================
  const state = {
    // Timing
    lastTickCount: -1,
    lastTickAtMs: 0,
    bpm: 120,
    subdiv: 4,

    // Sliders
    legato: 70,
    distance: 0,
    density: 40,

    // Chord input
    chordSource: 'midi', // kept for compatibility; mode switching removed
    chordNotesSet: new Set(),
    currentChordNotes: [],
    currentRootNote: -1,
    lastChordSignature: '',
    lastChordNotesSig: '',
    lastChordAttackSig: '',
    lastChordAttackMs: 0,
    needChordToneNext: true,
    lastChordChangeTick: null,
    chordChangeTicks: [0],

    // Key input
    currentKeyRoot: null,            // pitch class 0..11
    currentScaleType: null,          // 'major'/'minor'/...
    currentScalePCSet: null,         // Set<pitchClass>
    hasKey: false,
    currentKeyLabel: '—',

    // Pattern
    patternLen: 32,
    hitLevel: [],
    forcedHits: new Set(),
    roleMask: [],
    randA: [],
    randB: [],

    // Playback
    activeBassNote: null,
    activeBassOffTimer: null,

    // Repetition / grounding
    lastChosenBassNote: null,
    lastChosenRepeatCount: 0,

    // Generation seed
    patternSeed: 0,
  };

  // =========================================================
  // MIDI (in+out)
  // =========================================================
  const MIDI = {
    access: null,
    in: null,
    out: null,

    async init() {
      try {
        this.access = await navigator.requestMIDIAccess({ sysex:false });
        this.access.onstatechange = () => { this.refreshInputs(); this.refreshOutputs(); };
        this.refreshInputs();
        this.refreshOutputs();
        el.midiStatus.textContent = 'MIDI: ready';
      } catch (e) {
        el.midiStatus.textContent = 'MIDI: unavailable';
        console.warn('Web MIDI init failed', e);
      }
    },

    inputs() {
      if (!this.access) return [];
      return Array.from(this.access.inputs.values());
    },
    outputs() {
      if (!this.access) return [];
      return Array.from(this.access.outputs.values());
    },

    refreshInputs() {
      const ins = this.inputs();
      const old = el.midiIn.value;
      el.midiIn.innerHTML = '';
      if (!ins.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no inputs)';
        el.midiIn.appendChild(opt);
        this.selectInById('');
        return;
      }
      ins.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.id;
        opt.textContent = i.name || i.manufacturer || i.id;
        el.midiIn.appendChild(opt);
      });
      const pick = ins.find(i => i.id === old) || ins[0];
      el.midiIn.value = pick.id;
      this.selectInById(pick.id);
    },

    refreshOutputs() {
      const outs = this.outputs();
      const old = el.midiOut.value;
      el.midiOut.innerHTML = '';
      if (!outs.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no outputs)';
        el.midiOut.appendChild(opt);
        this.selectOutById('');
        return;
      }
      outs.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.name || o.manufacturer || o.id;
        el.midiOut.appendChild(opt);
      });
      const pick = outs.find(o => o.id === old) || outs[0];
      el.midiOut.value = pick.id;
      this.selectOutById(pick.id);
    },

    selectInById(id) {
      if (this.in) this.in.onmidimessage = null;
      const ins = this.inputs();
      this.in = ins.find(i => i.id === id) || null;
      if (this.in) this.in.onmidimessage = onMIDIMessage;
    },

    selectOutById(id) {
      const outs = this.outputs();
      this.out = outs.find(o => o.id === id) || null;
    },

    send(bytes) {
      if (this.out) this.out.send(bytes);
    },

    noteOn(note, vel=96, ch=BASS_MIDI_CH) {
      this.send([0x90 + (ch & 0x0F), note & 0x7F, vel & 0x7F]);
    },
    noteOff(note, ch=BASS_MIDI_CH) {
      this.send([0x80 + (ch & 0x0F), note & 0x7F, 0]);
    },
    allNotesOff() {
      if (!this.out) return;
      for (let ch=0; ch<16; ch++) this.out.send([0xB0 + ch, 123, 0]);
      for (let n=0; n<128; n++) this.out.send([0x80 + (BASS_MIDI_CH & 0x0F), n, 0]);
    },
    allNotesOffChannel(ch) {
      if (!this.out) return;
      const c = (ch & 0x0F);
      this.out.send([0xB0 + c, 123, 0]); // All Notes Off
      this.out.send([0xB0 + c, 120, 0]); // All Sound Off
    }
  };

  function parseStatus(status) {
    const type = status & 0xF0;
    const ch = status & 0x0F;
    return { type, ch };
  }

  // Debounce chord recompute (MIDI messages can arrive clustered on chord changes)
  let chordRecomputeTimer = null;
  function scheduleChordRecompute() {
    if (chordRecomputeTimer) clearTimeout(chordRecomputeTimer);
    chordRecomputeTimer = setTimeout(() => {
      chordRecomputeTimer = null;
      commitChordUpdate();
    }, 8);
  }

  // Always listening to MIDI chord/root (no mode switching)
  function onMIDIMessage(ev) {
    const data = ev.data || [];
    if (data.length < 2) return;

    const { type, ch } = parseStatus(data[0]);
    const note = data[1] & 0x7F;
    const vel  = (data.length > 2) ? (data[2] & 0x7F) : 0;

    const isNoteOn  = (type === 0x90 && vel > 0);
    const isNoteOff = (type === 0x80) || (type === 0x90 && vel === 0);

    if (ch === CHORD_CH) {
      if (isNoteOn) {
        state.chordNotesSet.add(note);
        scheduleChordRecompute();
      } else if (isNoteOff) {
        state.chordNotesSet.delete(note);
        scheduleChordRecompute();
      }
    } else if (ch === ROOT_CH) {
      if (isNoteOn) {
        state.currentRootNote = note;
        scheduleChordRecompute();
      } else if (isNoteOff) {
        if (state.currentRootNote === note) state.currentRootNote = -1;
        scheduleChordRecompute();
      }
    }
  }

  function normalizeChordNotes(arr) {
    const uniq = Array.from(new Set(arr.map(n => n|0))).filter(n => n >= 0 && n <= 127);
    uniq.sort((a,b)=>a-b);
    return uniq;
  }

  function chordSignature(chordNotes, rootNote) {
    return `r:${rootNote}|c:${chordNotes.join(',')}`;
  }

  function commitChordUpdate() {
    const chordNotes = normalizeChordNotes(Array.from(state.chordNotesSet));
    state.currentChordNotes = chordNotes;

    if (state.currentRootNote < 0 && chordNotes.length) state.currentRootNote = chordNotes[0];

    const chordNotesSig = chordNotes.join(',');
    const chordChanged = (chordNotesSig !== state.lastChordNotesSig);

    const sig = chordSignature(chordNotes, state.currentRootNote);
    const sigChanged = (sig !== state.lastChordSignature);
    if (sigChanged) state.lastChordSignature = sig;

    if (chordChanged) {
      state.lastChordNotesSig = chordNotesSig;
      state.needChordToneNext = true;
      const t = state.lastTickCount;
      if (t >= 0) recordChordChangeTick(t);
      renderChordUI();

      // Immediate chord-change attack note (independent of rhythm mask)
      chordChangeAttack('midi');
    } else {
      renderChordUI();
    }
  }

  function chordChangeAttack(source='midi') {
    const chord = state.currentChordNotes || [];
    if (!chord.length) return;
    if (!MIDI.out) return;

    const sig = chordSignature(chord, state.currentRootNote);
    const now = performance.now();
    if (state.lastChordAttackSig === sig && (now - (state.lastChordAttackMs||0)) < 25) return;
    state.lastChordAttackSig = sig;
    state.lastChordAttackMs = now;

    // Cut off current bass immediately
    if (state.activeBassOffTimer) { clearTimeout(state.activeBassOffTimer); state.activeBassOffTimer = null; }
    if (state.activeBassNote != null) {
      MIDI.noteOff(state.activeBassNote, BASS_MIDI_CH);
      state.activeBassNote = null;
    }
    MIDI.allNotesOffChannel(BASS_MIDI_CH);

    // Reset grounding
    state.lastChosenBassNote = null;
    state.lastChosenRepeatCount = 0;

    // New note: chord tones only, strongly prefer root
    const rootAbs = (state.currentRootNote >= 0) ? state.currentRootNote : chord[0];

    // NOTE: distance no longer controls register. Preserve existing "dist=0 plays exact root"
    // behavior, otherwise shift into fixed bass register.
    const dist = effectiveDistance();
    const { lo, hi } = currentRegisterLimits(rootAbs);
    const root = (dist === 0) ? (rootAbs|0) : shiftIntoRegister(rootAbs, lo, hi);

    MIDI.noteOn(root, 96, BASS_MIDI_CH);
    state.activeBassNote = root;

    state.needChordToneNext = false;
    state.lastChosenBassNote = root;
    state.lastChosenRepeatCount = 1;

    // Schedule note-off from current position
    const len = state.patternLen|0;
    if (len > 0 && state.lastTickCount >= 0) {
      const p = ((state.lastTickCount % len) + len) % len;
      scheduleLegatoNoteOff(root, p, len);
    } else {
      const ms = clamp(tickMs() * legatoFactor(), NOTE_MS_MIN, NOTE_MS_MAX);
      state.activeBassOffTimer = setTimeout(() => {
        MIDI.noteOff(root, BASS_MIDI_CH);
        if (state.activeBassNote === root) state.activeBassNote = null;
      }, ms);
    }

    el.noteDebug.textContent = `chord-attack(${source}) root=${root} sig=${sig}`;
  }

  function recordChordChangeTick(tickCount) {
    const t = ((tickCount % LOOP_TICKS) + LOOP_TICKS) % LOOP_TICKS;
    state.lastChordChangeTick = t;

    if (!state.chordChangeTicks.includes(0)) state.chordChangeTicks.push(0);
    if (!state.chordChangeTicks.includes(t)) state.chordChangeTicks.push(t);

    if (t === 0) state.chordChangeTicks = [0];
    state.chordChangeTicks.sort((a,b)=>a-b);
  }

  // =========================================================
  // BroadcastChannel chord source (optional)
  // (kept, but mode switching is removed; this feed is inactive)
  // =========================================================
  function initChordBC() {
    const bc = new BroadcastChannel(CHORD_BC_NAME);
    bc.onmessage = (ev) => {
      if (state.chordSource !== 'bc') return;
      const m = ev.data || {};
      if (!m || m.type !== 'chord') return;

      const chordNotes = Array.isArray(m.chordNotes) ? m.chordNotes.map(x=>x|0) : [];
      const root = (typeof m.rootNote === 'number') ? (m.rootNote|0) : -1;

      state.currentChordNotes = normalizeChordNotes(chordNotes);
      state.currentRootNote = root;
      if (state.currentRootNote < 0 && state.currentChordNotes.length) state.currentRootNote = state.currentChordNotes[0];

      const chordNotesSig = (state.currentChordNotes || []).join(',');
      const chordChanged = (chordNotesSig !== state.lastChordNotesSig);

      const sig = chordSignature(state.currentChordNotes, state.currentRootNote);
      const sigChanged = (sig !== state.lastChordSignature);
      if (sigChanged) state.lastChordSignature = sig;

      if (chordChanged) {
        state.lastChordNotesSig = chordNotesSig;
        state.needChordToneNext = true;
        if (state.lastTickCount >= 0) recordChordChangeTick(state.lastTickCount);
        renderChordUI();
        chordChangeAttack('bc');
      } else {
        renderChordUI();
      }
    };
  }

  // =========================================================
  // Key / scale feed (from Harmony.html)
  // =========================================================
  function initKeyBC() {
    const bc = new BroadcastChannel(KEY_BC_NAME);
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (!m || typeof m !== 'object') return;

      const parsed = parseKeyMessage(m);
      if (!parsed) return;

      state.currentKeyRoot = parsed.root;
      state.currentScaleType = parsed.scaleType;
      state.currentScalePCSet = parsed.pcSet;
      state.hasKey = !!(parsed.pcSet && parsed.pcSet.size);
      state.currentKeyLabel = parsed.label || '—';
      renderKeyUI();
    };
  }

  function parseKeyMessage(m) {
    const type = (typeof m.type === 'string') ? m.type.toLowerCase() : '';

    const isKeyMsg = (type === 'key') || (type.includes('key') && ('tonic' in m || 'tonicPc' in m || 'mode' in m));
    if (!isKeyMsg) {
      const mightBeKey = type.includes('key') || type.includes('scale') || ('key' in m) || ('scale' in m) || ('pcSet' in m) || ('pitchClasses' in m) || ('tonicPc' in m) || ('mode' in m);
      if (!mightBeKey) return null;
    }

    const pcsArr = Array.isArray(m.pcSet) ? m.pcSet
      : Array.isArray(m.pitchClasses) ? m.pitchClasses
      : Array.isArray(m.scalePCs) ? m.scalePCs
      : Array.isArray(m.pcs) ? m.pcs
      : null;
    if (pcsArr && pcsArr.length) {
      const pcSet = new Set(pcsArr.map(x => ((x|0) % 12 + 12) % 12));
      const root = extractKeyRoot(m);
      const scaleType = extractScaleType(m);
      const label = buildKeyLabel(m, root, scaleType);
      return { root, scaleType, pcSet, label };
    }

    if (typeof m.key === 'string') {
      const out = parseKeyString(m.key);
      if (out) return out;
    }

    const root = extractKeyRoot(m);
    const scaleType = extractScaleType(m);
    if (root == null || !scaleType) return null;

    const pcSet = buildScalePCSet(root, scaleType);
    if (!pcSet || !pcSet.size) return null;

    const label = buildKeyLabel(m, root, scaleType);
    return { root, scaleType, pcSet, label };
  }

  function buildKeyLabel(m, rootPc, scaleType) {
    let tonicName = null;
    if (typeof m.tonic === 'string' && m.tonic.trim()) tonicName = m.tonic.trim();
    if (!tonicName && rootPc != null) tonicName = pcToNoteName(rootPc);
    const mode = (typeof m.mode === 'string' && m.mode.trim()) ? m.mode.trim().toLowerCase()
               : (scaleType ? String(scaleType).trim().toLowerCase().replace(/_/g,' ') : '');
    if (!tonicName) return '—';
    if (!mode) return tonicName;
    return `${tonicName} ${mode}`;
  }

  function pcToNoteName(pc) {
    const names = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
    return names[((pc|0)%12+12)%12] || 'C';
  }

  function extractKeyRoot(m) {
    const numCand = (
      (typeof m.root === 'number' ? m.root : null) ??
      (typeof m.tonicPc === 'number' ? m.tonicPc : null) ??
      (typeof m.tonicMidi === 'number' ? m.tonicMidi : null) ??
      (typeof m.tonic === 'number' ? m.tonic : null) ??
      (typeof m.keyRoot === 'number' ? m.keyRoot : null) ??
      (typeof m.rootNote === 'number' ? m.rootNote : null) ??
      (typeof m.rootMidi === 'number' ? m.rootMidi : null)
    );
    if (numCand != null) {
      const n = numCand|0;
      return ((n % 12) + 12) % 12;
    }

    if (typeof m.tonic === 'string') {
      const pc = noteNameToPc(String(m.tonic).trim());
      if (pc != null) return pc;
    }
    if (typeof m.rootName === 'string') {
      const pc = noteNameToPc(String(m.rootName).trim());
      if (pc != null) return pc;
    }
    return null;
  }

  function extractScaleType(m) {
    const s = (
      (typeof m.scaleType === 'string' ? m.scaleType : null) ??
      (typeof m.scale === 'string' ? m.scale : null) ??
      (typeof m.mode === 'string' ? m.mode : null) ??
      (typeof m.quality === 'string' ? m.quality : null)
    );
    if (!s) return null;
    return String(s).trim().toLowerCase().replace(/\s+/g,'_');
  }

  function parseKeyString(str) {
    const s = String(str).trim();
    const m = s.match(/^([A-Ga-g])\s*([#b]?)(?:\s+|$)(.*)$/);
    if (!m) return null;
    const letter = m[1].toUpperCase();
    const accidental = m[2] || '';
    const rest = (m[3] || '').trim().toLowerCase();
    const rootPc = noteNameToPc(letter + accidental);
    if (rootPc == null) return null;
    const scaleType = rest ? rest.replace(/\s+/g,'_') : 'major';
    const pcSet = buildScalePCSet(rootPc, scaleType);
    if (!pcSet || !pcSet.size) return null;
    return { root: rootPc, scaleType, pcSet, label: `${letter+accidental} ${scaleType.replace(/_/g,' ')}` };
  }

  function noteNameToPc(name) {
    const map = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
    const L = name[0]?.toUpperCase();
    if (!map.hasOwnProperty(L)) return null;
    let pc = map[L];
    if (name.includes('#')) pc += 1;
    if (name.includes('b')) pc -= 1;
    return ((pc % 12) + 12) % 12;
  }

  function buildScalePCSet(rootPc, scaleType) {
    const r = ((rootPc|0) % 12 + 12) % 12;
    const type = String(scaleType || '').toLowerCase();
    const patterns = {
      major:            [0,2,4,5,7,9,11],
      minor:            [0,2,3,5,7,8,10],
      natural_minor:    [0,2,3,5,7,8,10],
      harmonic_minor:   [0,2,3,5,7,8,11],
      melodic_minor:    [0,2,3,5,7,9,11],
      dorian:           [0,2,3,5,7,9,10],
      phrygian:         [0,1,3,5,7,8,10],
      lydian:           [0,2,4,6,7,9,11],
      mixolydian:       [0,2,4,5,7,9,10],
      locrian:          [0,1,3,5,6,8,10],
    };
    const pat = patterns[type] || patterns[type.replace(/^ionian$/,'major')] || patterns[type.replace(/^aeolian$/,'minor')];
    if (!pat) return null;
    return new Set(pat.map(x => (r + x) % 12));
  }

  function renderKeyUI() {
    el.keyOut.textContent = state.hasKey ? (state.currentKeyLabel || '—') : '—';
  }

  // =========================================================
  // Ticks from Cadence (internal-ticker)
  // =========================================================
  function initTicker() {
    const bc = new BroadcastChannel('internal-ticker');
    bc.onmessage = (ev) => {
      const m = ev.data || {};
      if (!m) return;

      if (m.type === 'tick') {
        onTick(m);
      } else if ((m.type === 'transport' && (m.state === 'stopped' || m.play === false)) || m.type === 'stop') {
        panic('transport stop');
      }
    };
  }

  function onTick(msg) {
    const t = (msg.count|0) % LOOP_TICKS;
    state.lastTickCount = t;
    state.lastTickAtMs = performance.now();

    if (typeof msg.bpm === 'number' && msg.bpm > 0) state.bpm = msg.bpm;
    if (typeof msg.subdiv === 'number' && msg.subdiv > 0) state.subdiv = msg.subdiv;

    renderTickUI(t);
    playPatternTick(t);
  }

  function tickMs() {
    const bpm = (state.bpm && state.bpm > 0) ? state.bpm : 120;
    const subdiv = (state.subdiv && state.subdiv > 0) ? state.subdiv : 4;
    return 60000 / (bpm * subdiv);
  }

  // =========================================================
  // Bass pattern generation
  // =========================================================
  function choice(arr){ return arr[(Math.random()*arr.length)|0]; }

  function buildDefaultMasks(len) {
    return {
      hitLevel: new Array(len).fill(null),
      role:     new Array(len).fill('R'),
      randA:    new Array(len).fill(0),
      randB:    new Array(len).fill(0),
    };
  }

  function generateBassline() {
    const len = choice([16, 32, 64]);
    state.patternLen = len;

    state.patternSeed = ((Math.random() * 0x7FFFFFFF) | 0) ^ (Date.now() | 0);

    const { hitLevel, role, randA, randB } = buildDefaultMasks(len);

    const baseWeights = new Array(len).fill(1);
    for (let i=0; i<len; i++){
      const in16 = i % 16;
      if (in16 === 0) baseWeights[i] += 5;
      if (in16 === 8) baseWeights[i] += 3;
      if (in16 === 4 || in16 === 12) baseWeights[i] += 2;
      if (in16 % 2 === 0) baseWeights[i] += 1;
      if (in16 === 1 || in16 === 3 || in16 === 5 || in16 === 7 || in16 === 9 || in16 === 11 || in16 === 13 || in16 === 15) {
        baseWeights[i] -= 0.25;
      }
    }

    const MAX_HITS_PER16 = 7;
    const maxHits = Math.max(1, Math.round((MAX_HITS_PER16/16) * len));

    const picked = new Set();
    for (let k=0; k<maxHits; k++){
      let tries = 0;
      while (tries++ < 300) {
        const idx = weightedPickIndex(baseWeights);
        if (!picked.has(idx)) { picked.add(idx); break; }
      }
    }

    for (let i=0; i<len; i++){
      if (!picked.has(i)) { role[i] = 'R'; continue; }
      const in16 = i % 16;
      const strong = (in16 === 0 || in16 === 8 || in16 === 4 || in16 === 12);
      if (strong) role[i] = (Math.random() < 0.88) ? 'R' : 'O';
      else role[i] = (Math.random() < 0.70) ? 'R' : 'O';
    }

    const forcedHits = enforceAtLeastOneHitPerChordRegion(picked, len);
    const adjPairs = findAdjacentHitPairs(picked, len);

    const pickedArr = Array.from(picked);
    pickedArr.sort((a,b) => (baseWeights[b] - baseWeights[a]) || (a-b));
    const denom = Math.max(1, pickedArr.length - 1);
    for (let i=0; i<pickedArr.length; i++){
      const p = pickedArr[i];
      hitLevel[p] = i / denom;
    }
    for (const p of forcedHits) hitLevel[p] = 0;

    for (const [a,b] of adjPairs) {
      if (forcedHits.has(b)) continue;
      if (hitLevel[b] != null) hitLevel[b] = clamp(hitLevel[b] + 0.18, 0, 1);
    }

    for (let i=0; i<len; i++) {
      const r1 = u32ToUnit(hashU32(state.patternSeed, i * 2654435761));
      const r2 = u32ToUnit(hashU32(state.patternSeed ^ 0xA5A5A5A5, i * 1597334677));
      randA[i] = r1;
      randB[i] = r2;
    }

    state.hitLevel = hitLevel;
    state.forcedHits = forcedHits;
    state.roleMask = role;
    state.randA = randA;
    state.randB = randB;

    state.needChordToneNext = true;
    state.lastChosenBassNote = null;
    state.lastChosenRepeatCount = 0;

    el.patLenOut.textContent = String(len);
    el.densityOut.textContent = String(state.density|0);
    if (el.densityVal) el.densityVal.textContent = String(state.density|0);
    el.noteDebug.textContent = `Generated: len=${len}, maxHits=${picked.size}, forced=${forcedHits.size}`;
  }

  function findAdjacentHitPairs(pickedSet, len) {
    const out = [];
    for (let i=0; i<len; i++) {
      const a = i;
      const b = (i+1) % len;
      if (pickedSet.has(a) && pickedSet.has(b)) out.push([a,b]);
    }
    return out;
  }

  function weightedPickIndex(weights) {
    let sum = 0;
    for (const w of weights) sum += Math.max(0, w);
    if (sum <= 0) return 0;
    let r = Math.random() * sum;
    for (let i=0; i<weights.length; i++){
      r -= Math.max(0, weights[i]);
      if (r <= 0) return i;
    }
    return weights.length - 1;
  }

  function enforceAtLeastOneHitPerChordRegion(pickedSet, len) {
    const changes = (state.chordChangeTicks && state.chordChangeTicks.length)
      ? Array.from(new Set(state.chordChangeTicks.filter(t => t >= 0 && t < LOOP_TICKS)))
      : [0];

    if (!changes.includes(0)) changes.push(0);
    changes.sort((a,b)=>a-b);

    const boundaries = changes.map(t => Math.floor((t * len) / LOOP_TICKS));
    const uniqBounds = Array.from(new Set(boundaries)).sort((a,b)=>a-b);

    if (!uniqBounds.includes(0)) uniqBounds.unshift(0);
    if (!uniqBounds.includes(len)) uniqBounds.push(len);
    else if (uniqBounds[uniqBounds.length-1] !== len) uniqBounds.push(len);

    const forced = new Set();
    for (let i=0; i<uniqBounds.length-1; i++){
      const a = uniqBounds[i];
      const b = uniqBounds[i+1];
      if (b <= a) continue;

      let has = false;
      for (let p=a; p<b; p++){
        if (pickedSet.has(p)) { has = true; break; }
      }

      if (!has) {
        const forcedPos = a + Math.min(2, (b-a-1));
        pickedSet.add(forcedPos);
        forced.add(forcedPos);
      } else {
        for (let p=a; p<b; p++) {
          if (pickedSet.has(p)) { forced.add(p); break; }
        }
      }
    }
    return forced;
  }

  // =========================================================
  // Playback: Distance = harmonic eligibility ONLY (rebuilt)
  // =========================================================
  function chordPitchClassSet() {
    const chord = state.currentChordNotes || [];
    const pcs = new Set();
    for (const n of chord) pcs.add(((n|0) % 12 + 12) % 12);
    return pcs;
  }

  function effectiveDistance() {
    return clamp(state.distance|0, 0, 100);
  }

  function smoothstep01(t) {
    const x = clamp(t, 0, 1);
    return x * x * (3 - 2 * x);
  }

  // Register limits are fixed; distance MUST NOT affect register.
  function currentRegisterLimits(rootAbs) {
    const lo = BASS_LO;
    const baseTop = Math.max(BASS_HI_BASE, (rootAbs|0));
    const hi = clamp(baseTop, 0, 127);
    return { lo, hi };
  }

  function currentBassHi() {
    const rootAbs = (state.currentRootNote >= 0)
      ? state.currentRootNote
      : ((state.currentChordNotes && state.currentChordNotes[0] != null) ? state.currentChordNotes[0] : 48);
    return currentRegisterLimits(rootAbs).hi;
  }

  function intervalWeight(delta) {
    // Bias closer scale/chord tones slightly, but eligibility is governed by Distance.
    const d = ((delta|0) % 12 + 12) % 12;
    if (d === 0) return 1.00;
    if (d === 7) return 0.92;
    if (d === 5) return 0.80;
    if (d === 3 || d === 4) return 0.86;
    if (d === 2 || d === 9) return 0.70;
    if (d === 10 || d === 11) return 0.66;
    return 0.58;
  }

  function pickWeightedDeterministic(list, weights, r) {
    if (!list || !list.length) return null;
    if (!weights || weights.length !== list.length) return pickFromListDeterministic(list, r);

    let sum = 0;
    for (let i=0; i<weights.length; i++) sum += Math.max(0, weights[i] || 0);
    if (sum <= 0) return pickFromListDeterministic(list, r);

    let x = clamp(r, 0, 0.999999) * sum;
    for (let i=0; i<list.length; i++) {
      x -= Math.max(0, weights[i] || 0);
      if (x <= 0) return list[i];
    }
    return list[list.length - 1];
  }

  function pickFromListDeterministic(list, r) {
    if (!list || !list.length) return null;
    const idx = Math.min(list.length - 1, Math.max(0, Math.floor(clamp(r,0,0.999999) * list.length)));
    return list[idx];
  }

  function shiftIntoRegister(note, lo, hi) {
    let n = note|0;
    while (n > hi) n -= 12;
    while (n < lo) n += 12;
    if (n < 0) n = 0;
    if (n > 127) n = 127;
    return n;
  }

  function isAllowedPcForDistance(pc, rootPc, chordPCs, dist) {
    if (dist <= 0) return pc === rootPc;
    if (dist < 50) return chordPCs.has(pc);
    // dist >= 50: chord tones + key scale (if known), but we still enforce "no outside all sets"
    if (chordPCs.has(pc)) return true;
    if (state.hasKey && state.currentScalePCSet && state.currentScalePCSet.has(pc)) return true;
    return false;
  }

  function distanceCategoryWeights(dist, hasScaleOnly, hasChordOther) {
    // Spec envelope:
    // 0%: root only
    // 0..50: gradually introduce non-root chord tones
    // 50..100: gradually introduce scale-only tones
    if (dist <= 0) return { wRoot: 1, wChordOther: 0, wScaleOnly: 0 };

    const tChord = smoothstep01(Math.min(dist, 50) / 50);           // 0..1 over 0..50
    const tScale = smoothstep01(Math.max(0, dist - 50) / 50);       // 0..1 over 50..100

    // Use a simple normalized weight model:
    // - Root is always present.
    // - Chord-other weight grows from 0..1 over 0..50.
    // - Scale-only weight grows from 0..1 over 50..100.
    let wRoot = 1.0;
    let wChordOther = hasChordOther ? tChord : 0.0;
    let wScaleOnly = hasScaleOnly ? tScale : 0.0;

    // If we have no other categories available, keep root dominant by construction.
    return { wRoot, wChordOther, wScaleOnly };
  }

  function pickBassNote(roleChar, globalTick) {
    const chord = state.currentChordNotes || [];
    if (!chord.length) return null;

    const rootAbs = (state.currentRootNote >= 0) ? state.currentRootNote : chord[0];
    const rootPc = ((rootAbs|0) % 12 + 12) % 12;
    const chordPCs = chordPitchClassSet();

    const len = state.patternLen|0;
    const p = (len > 0) ? (globalTick % len) : 0;
    const rA = (state.randA && state.randA.length) ? (state.randA[p] ?? 0) : 0;
    const rB = (state.randB && state.randB.length) ? (state.randB[p] ?? 0) : 0;
    const rC = u32ToUnit(hashU32(state.patternSeed ^ 0xC001D00D, (globalTick|0) ^ (p<<16)));

    const dist = effectiveDistance();

    // Distance = 0: root ONLY (exact root from Ch 2)
    if (dist === 0) {
      state.needChordToneNext = false;
      state.lastChosenBassNote = rootAbs|0;
      state.lastChosenRepeatCount = 1;
      return rootAbs|0;
    }

    const { lo, hi } = currentRegisterLimits(rootAbs);
    const rootReg = shiftIntoRegister(rootAbs, lo, hi);

    // Keep existing grounding behavior: after chord change, strongly prefer root
    if (state.needChordToneNext) {
      state.needChordToneNext = false;
      updateRepeatMemory(rootReg);
      return rootReg;
    }

    // Candidate PC sets
    const chordOtherPCs = new Set();
    for (const pc of chordPCs) if (pc !== rootPc) chordOtherPCs.add(pc);

    let scaleOnlyPCs = new Set();
    if (state.hasKey && state.currentScalePCSet && state.currentScalePCSet.size) {
      for (const pc of state.currentScalePCSet) if (!chordPCs.has(pc)) scaleOnlyPCs.add(pc);
    }

    // Build register candidates (fixed register; distance does NOT change it)
    const chordOtherCand = buildRegisterCandidatesFromPCSet(chordOtherPCs, rootAbs, lo, hi);
    const scaleOnlyCand = buildRegisterCandidatesFromPCSet(scaleOnlyPCs, rootAbs, lo, hi);

    const hasChordOther = chordOtherCand.length > 0;
    const hasScaleOnly  = scaleOnlyCand.length > 0;

    // Repetition is allowed ONLY if the repeated note remains eligible at current distance.
    const prev = state.lastChosenBassNote;
    if (prev != null) {
      const prevPc = ((prev|0) % 12 + 12) % 12;
      if (isAllowedPcForDistance(prevPc, rootPc, chordPCs, dist)) {
        const prob = (state.lastChosenRepeatCount < 2) ? REUSE_PROB_BEFORE_TWO : REUSE_PROB_AFTER_TWO;
        if (rC < prob) {
          state.lastChosenRepeatCount++;
          return prev;
        }
      }
    }

    // Decide which eligibility bucket we draw from according to the distance envelope
    const { wRoot, wChordOther, wScaleOnly } = distanceCategoryWeights(dist, hasScaleOnly, hasChordOther);
    const sum = Math.max(1e-9, (wRoot + wChordOther + wScaleOnly));
    const x = clamp(rA, 0, 0.999999) * sum;

    let chosen = null;

    if (x < wRoot || (!hasChordOther && !hasScaleOnly)) {
      chosen = rootReg;
    } else if (x < (wRoot + wChordOther) || !hasScaleOnly) {
      // Choose from non-root chord tones
      const weights = chordOtherCand.map(n => intervalWeight((((n|0)%12+12)%12 - rootPc + 12)%12));
      chosen = pickWeightedDeterministic(chordOtherCand, weights, rB);
      if (chosen == null) chosen = rootReg;
    } else {
      // Choose from scale-only tones (outside chord but inside key scale)
      const weights = scaleOnlyCand.map(n => intervalWeight((((n|0)%12+12)%12 - rootPc + 12)%12));
      chosen = pickWeightedDeterministic(scaleOnlyCand, weights, rB);
      if (chosen == null) chosen = rootReg;
    }

    // Hard safety: must never output outside the allowed sets at current distance
    const chosenPc = ((chosen|0) % 12 + 12) % 12;
    if (!isAllowedPcForDistance(chosenPc, rootPc, chordPCs, dist)) chosen = rootReg;

    updateRepeatMemory(chosen);
    return chosen;
  }

  function updateRepeatMemory(chosen) {
    if (state.lastChosenBassNote === chosen) {
      state.lastChosenRepeatCount++;
    } else {
      state.lastChosenBassNote = chosen;
      state.lastChosenRepeatCount = 1;
    }
  }

  function buildRegisterCandidatesFromPCSet(pcSet, rootAbs, lo, hi) {
    const pcs = Array.from(pcSet || []);
    if (!pcs.length) return [];
    const out = [];

    const rootPc = ((rootAbs|0) % 12 + 12) % 12;
    for (const pc of pcs) {
      const delta = ((pc - rootPc) + 12) % 12;
      const base = shiftIntoRegister((rootAbs|0) + delta, lo, hi);

      for (let n = base; n >= lo; n -= 12) if ((((n%12)+12)%12) === pc) out.push(n);
      for (let n = base + 12; n <= hi; n += 12) if ((((n%12)+12)%12) === pc) out.push(n);
    }

    const uniq = Array.from(new Set(out)).sort((a,b)=>a-b);
    return uniq;
  }

  // =========================================================
  // Playback / rhythm / legato (unchanged)
  // =========================================================
  function densityThreshold() {
    return clamp((state.density|0) / 100, 0, 1);
  }

  function shouldPlayAtPos(pos) {
    const len = state.patternLen|0;
    if (len <= 0) return false;
    const p = ((pos|0) % len + len) % len;
    if (state.forcedHits && state.forcedHits.has(p)) return true;
    const lvl = (state.hitLevel && state.hitLevel.length) ? state.hitLevel[p] : null;
    if (lvl == null) return false;
    return lvl <= densityThreshold();
  }

  function ticksUntilNextHit(fromPos, len) {
    for (let i=1; i<=len; i++) {
      const p = (fromPos + i) % len;
      if (shouldPlayAtPos(p)) return i;
    }
    return len;
  }

  function legatoFactor() {
    const v = clamp((state.legato|0) / 100, 0, 1);
    return LEGATO_FACTOR_MIN + (LEGATO_FACTOR_MAX - LEGATO_FACTOR_MIN) * v;
  }

  function scheduleLegatoNoteOff(note, fromPos, len) {
    if (state.activeBassOffTimer) {
      clearTimeout(state.activeBassOffTimer);
      state.activeBassOffTimer = null;
    }
    const dticks = ticksUntilNextHit(fromPos, len);
    const ms = clamp(tickMs() * dticks * legatoFactor(), NOTE_MS_MIN, NOTE_MS_MAX);

    state.activeBassOffTimer = setTimeout(() => {
      if (state.activeBassNote === note) {
        MIDI.noteOff(note, BASS_MIDI_CH);
        state.activeBassNote = null;
      } else {
        MIDI.noteOff(note, BASS_MIDI_CH);
      }
    }, ms);
  }

  function playPatternTick(globalTick) {
    const len = state.patternLen|0;
    if (!len) return;
    const p = globalTick % len;

    if (!shouldPlayAtPos(p)) return;

    const roleChar = (state.roleMask && state.roleMask.length) ? (state.roleMask[p] || 'R') : 'R';
    const note = pickBassNote(roleChar, globalTick);
    if (note == null) return;

    const prev = state.activeBassNote;

    if (prev == null) {
      MIDI.noteOn(note, 96, BASS_MIDI_CH);
      state.activeBassNote = note;
      scheduleLegatoNoteOff(note, p, len);
      el.noteDebug.textContent = `tick=${globalTick} p=${p}/${len} note=${note} (new) key=${state.currentKeyLabel}`;
      return;
    }

    if (prev === note) {
      scheduleLegatoNoteOff(note, p, len);
      el.noteDebug.textContent = `tick=${globalTick} p=${p}/${len} note=${note} (held) key=${state.currentKeyLabel}`;
      return;
    }

    MIDI.noteOn(note, 96, BASS_MIDI_CH);
    state.activeBassNote = note;

    setTimeout(() => {
      MIDI.noteOff(prev, BASS_MIDI_CH);
    }, 10);

    scheduleLegatoNoteOff(note, p, len);

    el.noteDebug.textContent = `tick=${globalTick} p=${p}/${len} note=${note} (chg from ${prev}) key=${state.currentKeyLabel}`;
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  // =========================================================
  // UI + rendering
  // =========================================================
  function renderTickUI(t) {
    el.tickOut.textContent = String(t);
    el.bpmOut.textContent = String(Math.round(state.bpm || 120));
    el.subdivOut.textContent = String(state.subdiv || 4);
    el.lastChordTickOut.textContent = (state.lastChordChangeTick == null) ? '—' : String(state.lastChordChangeTick);
  }

  function renderChordUI() {
    el.chordOut.textContent = JSON.stringify(state.currentChordNotes || []);
    el.rootOut.textContent = (state.currentRootNote >= 0) ? String(state.currentRootNote) : '—';
  }

  function setChordSource(mode) {
    // Mode switching removed: chord is always read from MIDI input (Ch 1 chord tones, Ch 2 root).
    // Key is always read from BroadcastChannel 'music-key'.
    state.chordSource = 'midi';
    el.srcModeOut.textContent = 'MIDI Chords + Key BC';
    commitChordUpdate();
  }

  function panic(reason='panic') {
    if (state.activeBassOffTimer) { clearTimeout(state.activeBassOffTimer); state.activeBassOffTimer = null; }
    if (state.activeBassNote != null) {
      MIDI.noteOff(state.activeBassNote, BASS_MIDI_CH);
      state.activeBassNote = null;
    }
    MIDI.allNotesOff();
    el.noteDebug.textContent = `— (${reason})`;
  }

  function bindUI() {
    el.midiIn.addEventListener('change', (e) => MIDI.selectInById(e.target.value));
    el.midiOut.addEventListener('change', (e) => MIDI.selectOutById(e.target.value));
    el.genBtn.addEventListener('click', generateBassline);
    el.panicBtn.addEventListener('click', () => panic('panic'));

    const setReadout = (node, v) => { if (node) node.textContent = String(v|0); };

    el.legatoSlider.addEventListener('input', (e) => {
      state.legato = clamp(e.target.value|0, 0, 100);
      setReadout(el.legatoVal, state.legato);
    });
    el.distanceSlider.addEventListener('input', (e) => {
      state.distance = clamp(e.target.value|0, 0, 100);
      setReadout(el.distanceVal, state.distance);
    });
    el.densitySlider.addEventListener('input', (e) => {
      state.density = clamp(e.target.value|0, 0, 100);
      setReadout(el.densityVal, state.density);
      el.densityOut.textContent = String(state.density|0);
    });

    // Chord source toggling disabled: chord is always from MIDI (Ch 1+2), key is from BroadcastChannel 'music-key'.
    if (el.toggleSrcBtn) {
      el.toggleSrcBtn.disabled = true;
    }
  }

  function startSilenceGuard() {
    setInterval(() => {
      const now = performance.now();
      if (state.lastTickAtMs > 0 && (now - state.lastTickAtMs) > Math.max(300, tickMs() * 6)) {
        state.lastTickAtMs = 0;
        panic('ticks stopped');
      }
    }, 120);
  }

  // =========================================================
  // Deterministic helpers (u32 hashing)
  // =========================================================
  function hashU32(seed, x) {
    let h = (seed ^ x) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return h >>> 0;
  }
  function u32ToUnit(u) {
    return (u >>> 0) / 4294967296;
  }

  // =========================================================
  // Boot
  // =========================================================
  function boot() {
    bindUI();
    initTicker();
    initChordBC();
    initKeyBC();
    startSilenceGuard();
    MIDI.init();

    el.patLenOut.textContent = '—';
    el.densityOut.textContent = String(state.density|0);

    if (el.legatoSlider) el.legatoSlider.value = String(state.legato|0);
    if (el.distanceSlider) el.distanceSlider.value = String(state.distance|0);
    if (el.densitySlider) el.densitySlider.value = String(state.density|0);
    if (el.legatoVal) el.legatoVal.textContent = String(state.legato|0);
    if (el.distanceVal) el.distanceVal.textContent = String(state.distance|0);
    if (el.densityVal) el.densityVal.textContent = String(state.density|0);

    renderTickUI(0);
    renderChordUI();
    renderKeyUI();

    setChordSource('midi');
  }

  window.addEventListener('load', boot);
})();
</script>
</body>
</html>
