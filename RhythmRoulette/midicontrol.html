<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MIDI Control (Ableton)</title>

  <link rel="stylesheet" href="./rr-ui.css">
  <script src="./rr-ui.js" defer></script>

  <!-- Stage-ready minimal override -->
  <style>
    /**********************************************************************
     * TOGGLE ON STATE VISUAL FIX (CSS-DRIVEN, LOGIC UNCHANGED)
     **********************************************************************/
    :root{
      --_onBlue: var(--minui-accent, var(--rr-accent, var(--accent, var(--primary, #0a84ff))));
      --_onText: var(--minui-accentText, var(--rr-accentText, var(--on-accent, #ffffff)));
      --_tinyGap: 10px; /* increased tiny visual gap between buttons */
    }

    #toggles button.toggle.on,
    .minui-wrap #toggles button.toggle.on,
    body .minui-wrap #toggles button.toggle.on {
      background: var(--_onBlue) !important;
      color: var(--_onText) !important;
    }

    /**********************************************************************
     * ADD GAP BETWEEN BUTTONS (VISUAL ONLY)
     **********************************************************************/
    #toggles,
    #momentaries {
      gap: var(--_tinyGap) !important;
    }

    /**********************************************************************
     * "KNOBS" LAYOUT (KEEP BEHAVIOR)
     **********************************************************************/
    #sliders.knobs-row {
      display: flex !important;
      gap: 16px; /* slightly more spacing between knobs */
      align-items: flex-end;
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px; /* label closer to knob */
      min-width: 96px;
    }

    .knob-label-btn {
      width: 100%;
      text-align: center;
      font-size: 12px;
      line-height: 1.1;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .knob input[type="range"] { width: 92px; }

    .rename-inline{
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-transform: none;
      text-align: center;
    }

    .knob-label {
      width: 100%;
      min-height: 22px; /* a touch tighter */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <div class="minui-wrap">
    <!-- Removed top title text “Midi Control” -->

    <div class="panel minui-flatcard">
      <!-- Removed panel title text “MIDI Out” -->

      <div class="row minui-row">
        <label>Output
          <select id="midiOut"></select>
        </label>

        <!-- Output channel dropdown (1–16) -->
        <label>Ch
          <select id="outCh"></select>
        </label>

        <span class="pill small mono" id="status">Not connected</span>
      </div>
    </div>

    <div class="panel minui-flatcard">
      <!-- Removed section title text “Toggles (latching)” -->
      <div class="grid" id="toggles"></div>
    </div>

    <div class="panel minui-flatcard">
      <!-- Removed section title text “Momentary (one-shot)” -->
      <div class="grid" id="momentaries"></div>
    </div>

    <div class="panel minui-flatcard">
      <!-- Removed section title text “Knobs” -->
      <div class="grid knobs-row" id="sliders"></div>
    </div>

    <script>
      /**********************************************************************
       * MAPPING CONSTANTS (UNCHANGED)
       **********************************************************************/
      const MIDI_CHANNEL = 0;

      const TOGGLE_CCS = [20, 21, 22, 23, 24];
      const SLIDER_CCS = [30, 31, 32, 33, 34];

      const MOMENTARY_NOTES = [60, 61, 62, 63, 64];
      const MOMENTARY_VELOCITY = 100;
      const MOMENTARY_NOTE_OFF_MS = 40;

      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      /**********************************************************************
       * Web MIDI (OUTPUT ONLY)
       **********************************************************************/
      let midiAccess = null;
      let midiOut = null;

      // runtime-selected channel (defaults to MIDI_CHANNEL)
      let selectedOutChannel = MIDI_CHANNEL; // 0–15

      const els = {
        midiOut: document.getElementById("midiOut"),
        outCh: document.getElementById("outCh"),
        status: document.getElementById("status"),
        toggles: document.getElementById("toggles"),
        momentaries: document.getElementById("momentaries"),
        sliders: document.getElementById("sliders"),
      };

      function setStatus(text, isWarn=false) {
        els.status.textContent = text;
        els.status.classList.toggle("warn", !!isWarn);
      }

      function refreshConnectionStatus() {
        if (midiOut) setStatus("Connected");
        else setStatus("Not connected", true);
      }

      function resetOutChannelToDefault() {
        // Requirement: always default to Channel 1 (0) whenever an output/bus is chosen.
        selectedOutChannel = 0;
        if (els.outCh) els.outCh.value = "0";
      }

      function populateOutChannels() {
        els.outCh.innerHTML = "";
        for (let ch = 1; ch <= 16; ch++) {
          const opt = document.createElement("option");
          opt.value = String(ch - 1);      // store 0–15
          opt.textContent = String(ch);    // display 1–16
          els.outCh.appendChild(opt);
        }
        resetOutChannelToDefault();
      }

      function listOutputs() {
        els.midiOut.innerHTML = "";
        const outs = Array.from(midiAccess.outputs.values());

        outs.forEach((port, idx) => {
          const opt = document.createElement("option");
          opt.value = port.id;
          opt.textContent = `${idx + 1}: ${port.name || "Unnamed Output"}`;
          els.midiOut.appendChild(opt);
        });

        if (outs.length === 0) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "No MIDI outputs found";
          els.midiOut.appendChild(opt);
          midiOut = null;
          refreshConnectionStatus();
        } else {
          els.midiOut.selectedIndex = 0;
          // bus chosen (auto-connect) => force channel 1 default
          resetOutChannelToDefault();
          selectOutput(els.midiOut.value);
        }
      }

      function selectOutput(id) {
        midiOut = midiAccess.outputs.get(id) || null;
        refreshConnectionStatus();
      }

      function sendCC(ccNumber, value) {
        if (!midiOut) return;
        const v = clamp(Math.round(value), 0, 127);
        const status = 0xB0 | (selectedOutChannel & 0x0F);
        midiOut.send([status, ccNumber & 0x7F, v]);
      }

      function sendNoteOn(note, velocity) {
        if (!midiOut) return;
        const status = 0x90 | (selectedOutChannel & 0x0F);
        midiOut.send([status, note & 0x7F, clamp(velocity, 0, 127)]);
      }

      function sendNoteOff(note, velocity=0) {
        if (!midiOut) return;
        const status = 0x80 | (selectedOutChannel & 0x0F);
        midiOut.send([status, note & 0x7F, clamp(velocity, 0, 127)]);
      }

      /**********************************************************************
       * LONG-PRESS INLINE RENAME (KEEP SYSTEM, RESTORE FOR BUTTONS)
       **********************************************************************/
      const KNOB_LABELS_KEY = "midicontrol_knob_labels_v1";
      const TOGGLE_LABELS_KEY = "midicontrol_toggle_labels_v1";
      const SHOT_LABELS_KEY = "midicontrol_shot_labels_v1";
      const LONG_PRESS_MS = 450;

      function loadLabels(key, fallbackArray) {
        try {
          const raw = localStorage.getItem(key);
          const parsed = raw ? JSON.parse(raw) : null;
          if (Array.isArray(parsed) && parsed.length === fallbackArray.length) return parsed;
        } catch (_) {}
        return fallbackArray.slice();
      }

      function saveLabels(key, labels) {
        try { localStorage.setItem(key, JSON.stringify(labels)); } catch (_) {}
      }

      /**
       * Attach long-press inline rename to an element.
       * IMPORTANT: prevents the element's normal click handler from firing
       * when a long-press rename was triggered.
       */
      function attachLongPressRename(targetEl, getText, setText) {
        let t = null;
        let pressed = false;
        let didLongPress = false;

        const clear = () => {
          if (t) { clearTimeout(t); t = null; }
          pressed = false;
        };

        const openEditor = () => {
          const current = getText();

          // mark that we triggered rename (so we can suppress click)
          didLongPress = true;

          const input = document.createElement("input");
          input.className = "rename-inline";
          input.type = "text";
          input.value = current;

          targetEl.textContent = "";
          targetEl.appendChild(input);

          const commit = () => {
            const next = (input.value || "").trim() || current;
            setText(next);
            targetEl.textContent = next;
          };

          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") input.blur();
            if (e.key === "Escape") {
              targetEl.textContent = current;
              e.preventDefault();
              e.stopPropagation();
            }
          });

          input.addEventListener("blur", commit);
          input.focus();
          input.select();
        };

        // Suppress the normal click that can occur after long-press editing starts
        targetEl.addEventListener("click", (e) => {
          if (didLongPress) {
            didLongPress = false;
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true); // capture so we intercept before existing click handlers

        targetEl.addEventListener("pointerdown", () => {
          clear();
          pressed = true;
          didLongPress = false;
          t = setTimeout(() => {
            if (!pressed) return;
            openEditor();
          }, LONG_PRESS_MS);
        });

        targetEl.addEventListener("pointerup", clear);
        targetEl.addEventListener("pointercancel", clear);
        targetEl.addEventListener("pointerleave", clear);

        targetEl.addEventListener("contextmenu", (e) => e.preventDefault());
      }

      /**********************************************************************
       * UI BUILDERS (MIDI LOGIC UNCHANGED)
       **********************************************************************/
      function buildToggles() {
        els.toggles.innerHTML = "";

        const labels = loadLabels(
          TOGGLE_LABELS_KEY,
          ["Toggle 1", "Toggle 2", "Toggle 3", "Toggle 4", "Toggle 5"]
        );

        for (let i = 0; i < 5; i++) {
          const btn = document.createElement("button");
          btn.className = "toggle";
          btn.textContent = labels[i];
          btn.dataset.on = "0";

          const cc = TOGGLE_CCS[i];

          // Restore long-press rename on the button itself
          attachLongPressRename(
            btn,
            () => labels[i],
            (next) => {
              labels[i] = next;
              saveLabels(TOGGLE_LABELS_KEY, labels);
            }
          );

          // Latching behavior unchanged
          btn.addEventListener("click", () => {
            const isOn = btn.dataset.on === "1";
            const next = !isOn;
            btn.dataset.on = next ? "1" : "0";
            btn.classList.toggle("on", next);
            sendCC(cc, next ? 127 : 0);
          });

          els.toggles.appendChild(btn);
        }
      }

      function buildMomentaries() {
        els.momentaries.innerHTML = "";

        const labels = loadLabels(
          SHOT_LABELS_KEY,
          ["Shot 1", "Shot 2", "Shot 3", "Shot 4", "Shot 5"]
        );

        for (let i = 0; i < 5; i++) {
          const btn = document.createElement("button");
          btn.textContent = labels[i];

          const note = MOMENTARY_NOTES[i];

          // Restore long-press rename on the button itself
          attachLongPressRename(
            btn,
            () => labels[i],
            (next) => {
              labels[i] = next;
              saveLabels(SHOT_LABELS_KEY, labels);
            }
          );

          // Momentary logic unchanged
          btn.addEventListener("click", () => {
            sendNoteOn(note, MOMENTARY_VELOCITY);
            setTimeout(() => sendNoteOff(note, 0), MOMENTARY_NOTE_OFF_MS);
          });

          els.momentaries.appendChild(btn);
        }
      }

      function buildSliders() {
        els.sliders.innerHTML = "";
        els.sliders.classList.add("knobs-row");

        const labels = loadLabels(
          KNOB_LABELS_KEY,
          ["Knob 1", "Knob 2", "Knob 3", "Knob 4", "Knob 5"]
        );

        for (let i = 0; i < 5; i++) {
          const wrap = document.createElement("div");
          wrap.className = "knob";

          const labelWrap = document.createElement("div");
          labelWrap.className = "knob-label";

          const labelBtn = document.createElement("button");
          labelBtn.type = "button";
          labelBtn.className = "knob-label-btn";
          labelBtn.textContent = labels[i];

          attachLongPressRename(
            labelBtn,
            () => labels[i],
            (next) => {
              labels[i] = next;
              saveLabels(KNOB_LABELS_KEY, labels);
            }
          );

          labelWrap.appendChild(labelBtn);

          const slider = document.createElement("input");
          slider.type = "range";
          slider.min = "0";
          slider.max = "127";
          slider.step = "1";
          slider.value = "0";

          const cc = SLIDER_CCS[i];

          let pending = false;
          let lastVal = 0;

          slider.addEventListener("input", () => {
            lastVal = clamp(parseInt(slider.value, 10) || 0, 0, 127);
            if (!pending) {
              pending = true;
              requestAnimationFrame(() => {
                pending = false;
                sendCC(cc, lastVal);
              });
            }
          });

          wrap.appendChild(labelWrap);
          wrap.appendChild(slider);

          els.sliders.appendChild(wrap);
        }
      }

      /**********************************************************************
       * INIT
       **********************************************************************/
      els.midiOut.addEventListener("change", () => {
        // bus chosen (manual) => force channel 1 default
        resetOutChannelToDefault();
        selectOutput(els.midiOut.value);
      });

      // output channel selection
      els.outCh.addEventListener("change", () => {
        selectedOutChannel = clamp(parseInt(els.outCh.value, 10) || 0, 0, 15);
      });

      populateOutChannels();
      buildToggles();
      buildMomentaries();
      buildSliders();

      (async function initMIDI() {
        if (!navigator.requestMIDIAccess) {
          setStatus("Web MIDI not supported (use Chrome/Edge).", true);
          return;
        }

        try {
          midiAccess = await navigator.requestMIDIAccess({ sysex: false });
        } catch (err) {
          setStatus("MIDI access denied / unavailable.", true);
          return;
        }

        setStatus("MIDI ready");
        listOutputs();

        midiAccess.onstatechange = () => {
          const prevOutId = els.midiOut.value;
          listOutputs();

          if (prevOutId && midiAccess.outputs.has(prevOutId)) {
            els.midiOut.value = prevOutId;
            selectOutput(prevOutId);
          }
        };
      })();
    </script>
  </div>
</body>
</html>
