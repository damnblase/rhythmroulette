<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DroneNote — High Minor-Scale Drone (Ticker Synced)</title>
  <link rel="stylesheet" href="./rr-ui.css">
  <script src="./rr-ui.js" defer></script>
  <style>
    /* Minimal, consistent UI */
    body { margin: 0; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    label { white-space: nowrap; }
    select, button { height: 34px; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.10);
      font-size: 12px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .spacer { flex: 1; }
    .divider { height: 1px; background: rgba(0,0,0,0.08); margin: 12px 0; width: 100%; }
    .primary { font-weight: 600; }
    .kv { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
    .kv .k { opacity: 0.65; font-size: 12px; }
    .kv .v { font-size: 13px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <label for="midiOut">Output</label>
        <select id="midiOut" aria-label="MIDI Out"></select>

        <label for="midiCh">Ch</label>
        <select id="midiCh" aria-label="MIDI Channel"></select>

        <span id="midiStatus" class="pill">MIDI: —</span>

        <span class="spacer"></span>

        <button id="randPitch" class="primary">Randomize Pitch</button>
      </div>

      <div class="divider"></div>

      <div class="kv">
        <div><span class="k">Key:</span> <span class="v mono" id="keyOut">C minor (tonicPc=0)</span></div>
        <div><span class="k">Drone:</span> <span class="v mono" id="droneOut">—</span></div>
        <div><span class="k">Last tick:</span> <span class="v mono" id="tickOut">—</span></div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ============================================================
  // Spec constants
  // ============================================================
  const NATURAL_MINOR = [0, 2, 3, 5, 7, 8, 10]; // pitch-class intervals
  const LOOP_LEN = 128; // Cadence: ticks 0..127

  // "High register" target: keep drone in this fixed region consistently.
  const DRONE_LO = 84;   // ~C6
  const DRONE_HI = 108;  // ~C8

  const NOTE_ON_VEL = 96;

  // ============================================================
  // DOM
  // ============================================================
  const $ = (s) => document.querySelector(s);
  const el = {
    midiOut: $('#midiOut'),
    midiCh: $('#midiCh'),
    midiStatus: $('#midiStatus'),
    randPitch: $('#randPitch'),
    keyOut: $('#keyOut'),
    droneOut: $('#droneOut'),
    tickOut: $('#tickOut'),
  };

  // ============================================================
  // Helpers (PC / note naming / range)
  // ============================================================
  const PC_NAMES = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];

  function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
  function mod12(n){ return ((n % 12) + 12) % 12; }

  function nearestInRange(pc, lo, hi){
    // Find a MIDI note in [lo, hi] whose pitch class == pc, preferring higher-ish within the band.
    pc = mod12(pc);
    let best = lo - ((lo - pc) % 12);
    while (best < lo) best += 12;
    while (best > hi) best -= 12;
    if (best < lo) best += 12;
    if (best > hi) best -= 12;
    return clamp(best, lo, hi);
  }

  function pcToName(pc){ return PC_NAMES[mod12(pc)]; }

  // ============================================================
  // MIDI
  // ============================================================
  const MIDI = {
    access: null,
    out: null,
    channel0: 0, // 0..15

    outputs(){
      if (!this.access) return [];
      return Array.from(this.access.outputs.values());
    },

    send(bytes){
      if (!this.out) return;
      this.out.send(bytes);
    },

    noteOn(note){
      this.send([0x90 + (this.channel0 & 0x0F), note & 0x7F, NOTE_ON_VEL]);
    },

    noteOff(note){
      this.send([0x80 + (this.channel0 & 0x0F), note & 0x7F, 0]);
    },

    allNotesOff(){
      if (!this.out) return;
      // CC 123 on all channels (safety)
      for (let ch = 0; ch < 16; ch++){
        this.out.send([0xB0 + ch, 123, 0]);
      }
    },

    refreshOutputs(){
      const outs = this.outputs();
      const oldId = el.midiOut.value;

      el.midiOut.innerHTML = '';
      if (outs.length === 0){
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '(no outputs)';
        el.midiOut.appendChild(opt);
        el.midiOut.disabled = true;
        this.out = null;
        setStatus('No MIDI outputs');
        return;
      }

      outs.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.name || o.id;
        el.midiOut.appendChild(opt);
      });

      const pick = outs.find(o => o.id === oldId) || outs[0];
      el.midiOut.value = pick.id;
      el.midiOut.disabled = false;
      this.out = pick;
      setStatus('Connected');
    },

    selectById(id){
      const outs = this.outputs();
      this.out = outs.find(o => o.id === id) || null;
      if (!this.out) setStatus('No MIDI outputs');
    },

    async init(){
      if (!navigator.requestMIDIAccess){
        setStatus('MIDI unavailable');
        return;
      }
      try {
        this.access = await navigator.requestMIDIAccess({ sysex:false });
        this.refreshOutputs();

        // Rescan a few times (ports can appear slightly later)
        let tries = 0;
        const kick = () => {
          tries++;
          this.refreshOutputs();
          if (this.outputs().length === 0 && tries < 6) setTimeout(kick, 150 * tries);
        };
        setTimeout(kick, 50);

        this.access.onstatechange = () => this.refreshOutputs();
      } catch (e){
        console.warn('MIDI init failed', e);
        setStatus('MIDI unavailable');
      }
    }
  };

  function setStatus(text){
    el.midiStatus.textContent = text;
  }

  function fillChannelSelect(){
    el.midiCh.innerHTML = '';
    for (let ch = 1; ch <= 16; ch++){
      const opt = document.createElement('option');
      opt.value = String(ch);
      opt.textContent = String(ch);
      el.midiCh.appendChild(opt);
    }
    el.midiCh.value = '1';
    MIDI.channel0 = 0;
  }

  // ============================================================
  // Drone state
  // ============================================================
  const state = {
    // Default key: C minor until Harmony sends a key
    tonicPc: 0,
    mode: 'minor',

    // Drone is tracked by degree index 0..6 (scale degree), so it always stays "in the scale"
    degreeIndex: 0,

    // Current computed MIDI note
    droneMidi: -1,

    // Whether we believe note is currently sounding
    isOn: false,

    lastTick: null,
  };

  function currentScalePcs(){
    return NATURAL_MINOR.map(iv => mod12(state.tonicPc + iv));
  }

  function computeDroneMidiForDegree(degIdx){
    const scale = currentScalePcs();
    const pc = scale[clamp(degIdx|0, 0, 6)];
    return nearestInRange(pc, DRONE_LO, DRONE_HI);
  }

  function updateUI(){
    el.keyOut.textContent = `${pcToName(state.tonicPc)} ${state.mode} (tonicPc=${mod12(state.tonicPc)})`;
    if (state.droneMidi >= 0){
      const pc = mod12(state.droneMidi);
      const oct = Math.floor(state.droneMidi / 12) - 1;
      el.droneOut.textContent = `${pcToName(pc)}${oct} (MIDI ${state.droneMidi}) • deg ${state.degreeIndex+1}/7`;
    } else {
      el.droneOut.textContent = '—';
    }
  }

  // Always do note-off then note-on for retrigger, as specified.
  function retriggerSamePitch(){
    if (!MIDI.out || state.droneMidi < 0) return;
    // Note-off then note-on (same pitch)
    MIDI.noteOff(state.droneMidi);
    MIDI.noteOn(state.droneMidi);
    state.isOn = true;
  }

  function stopDrone(safetyReason){
    if (!MIDI.out) return;
    if (state.droneMidi >= 0){
      try { MIDI.noteOff(state.droneMidi); } catch {}
    }
    // Optional extra safety
    try { MIDI.allNotesOff(); } catch {}
    state.isOn = false;
  }

  function startOrKeepDrone(){
    if (!MIDI.out) return;

    if (state.droneMidi < 0){
      state.droneMidi = computeDroneMidiForDegree(state.degreeIndex);
    }

    // Ensure continuous: if not on, turn on
    if (!state.isOn){
      MIDI.noteOn(state.droneMidi);
      state.isOn = true;
    }
    updateUI();
  }

  function setDegreeAndPlay(newDegIdx){
    const nextDeg = clamp(newDegIdx|0, 0, 6);
    const nextMidi = computeDroneMidiForDegree(nextDeg);

    if (!MIDI.out){
      state.degreeIndex = nextDeg;
      state.droneMidi = nextMidi;
      state.isOn = false;
      updateUI();
      return;
    }

    // Immediate apply: note-off old, note-on new
    if (state.droneMidi >= 0){
      MIDI.noteOff(state.droneMidi);
    }
    state.degreeIndex = nextDeg;
    state.droneMidi = nextMidi;
    MIDI.noteOn(state.droneMidi);
    state.isOn = true;
    updateUI();
  }

  function randomizePitch(){
    // Picks a different scale degree than current (if possible)
    const choices = [0,1,2,3,4,5,6].filter(d => d !== state.degreeIndex);
    const pick = choices.length ? choices[Math.floor(Math.random() * choices.length)] : state.degreeIndex;
    setDegreeAndPlay(pick);
  }

  // ============================================================
  // BroadcastChannels
  // ============================================================
  function initTickerListener(){
    const bc = new BroadcastChannel('internal-ticker');
    bc.onmessage = (ev) => {
      const m = ev && ev.data ? ev.data : null;
      if (!m || m.type !== 'tick') return;

      const count = (m.count|0);
      state.lastTick = count;
      el.tickOut.textContent = String(count);

      // Re-trigger rules:
      // - On tick count === 0 (loop start)
      // - On tick count === 127 (end boundary)
      if (count === 0 || count === (LOOP_LEN - 1)){
        retriggerSamePitch();
      }
    };
  }

  function initRandomizeAllListener(){
    const bc = new BroadcastChannel('randomize_channel');
    bc.onmessage = (ev) => {
      const m = ev && ev.data ? ev.data : null;
      if (!m) return;
      if (m.type === 'randomize_all'){
        // Must call same function as Randomize Pitch button (no duplicated logic)
        randomizePitch();
      }
    };
  }

  function initKeyListener(){
    const bc = new BroadcastChannel('music-key');
    bc.onmessage = (ev) => {
      const m = ev && ev.data ? ev.data : null;
      if (!m) return;
      if (m.type !== 'key') return;

      if (typeof m.tonicPc === 'number'){
        state.tonicPc = mod12(m.tonicPc);
      }

      // Harmony is minor-only in practice, but accept mode if present.
      if (typeof m.mode === 'string'){
        const mm = m.mode.toLowerCase();
        state.mode = (mm === 'major') ? 'major' : 'minor';
      } else {
        state.mode = 'minor';
      }

      // We assume minor for the scale logic; if a "major" slips through,
      // we still keep using natural minor intervals as specified.
      // Keep same degree index; recompute pitch in the new key and apply immediately
      // so the drone always stays inside the current scale.
      setDegreeAndPlay(state.degreeIndex);
    };
  }

  // ============================================================
  // UI wiring + safety
  // ============================================================
  function bindUI(){
    el.randPitch.addEventListener('click', () => randomizePitch());

    el.midiOut.addEventListener('change', () => {
      // Safety: note-off on output change
      stopDrone('output change');
      MIDI.selectById(el.midiOut.value);
      if (MIDI.out){
        setStatus('Connected');
        // Resume drone on new output
        startOrKeepDrone();
      }
    });

    el.midiCh.addEventListener('change', () => {
      const ch1 = parseInt(el.midiCh.value, 10) || 1;
      MIDI.channel0 = clamp(ch1, 1, 16) - 1;

      // Channel change: re-articulate to ensure it is sounding on the selected channel
      if (MIDI.out && state.droneMidi >= 0){
        // Note-off old channel isn't possible without tracking per-channel note state,
        // so we do a safe all-notes-off then restart the drone.
        MIDI.allNotesOff();
        state.isOn = false;
        startOrKeepDrone();
      }
    });

    window.addEventListener('beforeunload', () => {
      // Safety: note-off on unload
      stopDrone('unload');
    });
  }

  // ============================================================
  // Boot
  // ============================================================
  async function boot(){
    fillChannelSelect();
    bindUI();

    // Start listening immediately (even if MIDI not granted yet)
    initTickerListener();
    initRandomizeAllListener();
    initKeyListener();

    // Default state: C minor, degree 1
    state.droneMidi = computeDroneMidiForDegree(state.degreeIndex);
    updateUI();

    // Init MIDI, then start drone (continuous)
    await MIDI.init();
    if (MIDI.outputs().length > 0){
      startOrKeepDrone();
    } else {
      // status already set in refreshOutputs()
      updateUI();
    }
  }

  window.addEventListener('load', boot);
})();
</script>
</body>
</html>
