<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HTML Metronome — Sample-Accurate 16th-Note Ticker</title>
<link rel="stylesheet" href="./rr-ui.css">
<script src="./rr-ui.js" defer></script>
</head>

<body>
  <div class="wrap minui-wrap">
<div class="row minui-row">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="internal-ticker">Internal Ticker</option>
        <option value="external-ticker">External Ticker</option>
      </select>
    </div>

    <div class="row minui-row">
      <input id="bpm" class="rr-bpm" type="number" min="40" max="300" step="1" value="120" aria-label="BPM" />
      <button id="bpmMinus10" type="button">−10</button>
      <button id="bpmPlus10" type="button">+10</button>
      <button id="bpmRand" class="rand-btn" type="button" title="Random BPM">⟳</button>
      <span class="note" id="tickMsNote" style="display:none"></span>
    </div>

    <div class="row minui-row">
      <label for="swing">Swing</label>
      <input id="swing" type="range" min="0" max="100" step="1" value="0" />
      <span id="swingVal" class="note">0</span>
    </div>

    <div class="row minui-row">
      <div class="buttons">
        <button id="playBtn" title="Space toggles too">Play</button>
         <button id="randomizeAll" class="rand-btn" title="Randomize All">⟳</button>
      </div>
    </div>

    <div class="lights" id="lights" aria-hidden="true"></div>

    <div class="status" id="status">
      <div><strong>Status:</strong> <span id="playState">Stopped</span></div>
      <div><strong>Loop:</strong> <span id="tickOut">—</span> / 0..127 &nbsp; | &nbsp; <strong>Beat:</strong> <span id="beatOut">—</span> / 0..31 &nbsp; | &nbsp; <strong>Sub:</strong> <span id="subOut">—</span> / 0..3</div>
      <div><strong>BPM:</strong> <span id="bpmOut">120</span> &nbsp; | &nbsp; <strong>Swing:</strong> <span id="swingOut">0</span></div>
      <div><strong>Channel:</strong> <span id="channelOut" class="note">internal-ticker</span></div>
    </div>
  </div>

<script>
(() => {
  // ===== Constants =====
  const LOOP_TICKS = 128;     // 32 beats * 4 (sixteenth notes)
  const SUBDIV = 4;           // 16ths per beat
  const LOOKAHEAD_SEC = 0.10; // schedule this far into the future on the audio timeline
  const SCHED_INTERVAL_MS = 25; // how often to refill the schedule buffer
  const SWING_GUARD = 0.49;   // cap swing at 49% of 16th duration

  // ===== DOM =====
  const $ = (sel) => document.querySelector(sel);
  const bpmInput = $('#bpm');
  const bpmMinus10Btn = $('#bpmMinus10');
  const bpmPlus10Btn = $('#bpmPlus10');
  const bpmRandBtn = $('#bpmRand');
  const swingInput = $('#swing');
  const swingVal = $('#swingVal');
  const tickMsNote = $('#tickMsNote');
  const playBtn = $('#playBtn');
  const stopBtn = $('#stopBtn');
  const playStateEl = $('#playState');
  const bpmOut = $('#bpmOut');
  const swingOut = $('#swingOut');
  const tickOut = $('#tickOut');
  const beatOut = $('#beatOut');
  const subOut = $('#subOut');
  const lightsWrap = $('#lights');
  const modeSelect = $('#mode');
  const channelOut = $('#channelOut');

  // Beat lights (4-group visualizer)
  const beatLights = [];
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    d.className = 'light' + (i === 0 ? ' downbeat' : '');
    lightsWrap.appendChild(d);
    beatLights.push(d);
  }

  // ===== Audio Schedule=====
  let ctx = null;
  let isPlaying = false;
  let schedulerTimer = null;

  // Anchors & indices
  let startCtxTime = 0;       // ctx.currentTime at (re)start
  let nextTickIndex = 0;      // 0..127 for the next tick to schedule/post
  let nextTickCtxTime = 0;    // exact (base) ctx time of next tick without swing

  // Track scheduled nodes so we can cancel them on Stop
  const scheduledNodes = new Set();
  function keep(node) { scheduledNodes.add(node); }
  function release(node) { try { node.disconnect(); } catch {} scheduledNodes.delete(node); }

  // ===== Helpers =====
  function getBPM() {
    const v = Math.max(40, Math.min(300, parseFloat(bpmInput.value || '120')));
    return v;
  }
  function clampBpm(v) {
    const min = (bpmInput && bpmInput.min !== '' && bpmInput.min != null) ? parseFloat(bpmInput.min) : 40;
    const max = (bpmInput && bpmInput.max !== '' && bpmInput.max != null) ? parseFloat(bpmInput.max) : 300;
    return Math.max(min, Math.min(max, v));
  }

  function setBpmThroughInput(v) {
    const clamped = clampBpm(v);
    bpmInput.value = String(Math.round(clamped));
    bpmInput.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function sixteenthMsAtBPM(bpm) { return (60000 / bpm) / 4; }
  function sixteenthSecAtBPM(bpm) { return sixteenthMsAtBPM(bpm) / 1000; }
  function swingMs(bpm, pct) {
    const T = sixteenthMsAtBPM(bpm);
    const Smax = SWING_GUARD * T;
    return (pct / 100) * Smax;
  }
  function swingSec(bpm, pct) { return swingMs(bpm, pct) / 1000; }

  function updateDerivedUI() {
    const bpm = getBPM();
    const Tms = sixteenthMsAtBPM(bpm);
    // UI-only: keep internal timing calculations unchanged, but do not display ms approximations
    if (tickMsNote) tickMsNote.textContent = '';
    const pct = parseInt(swingInput.value, 10) || 0;
    const S = swingMs(bpm, pct); // still computed for internal use (no behavior change)
    swingVal.textContent = `${pct}`;
    bpmOut.textContent = String(bpm);
    swingOut.textContent = `${pct}`;
  }

  function flashLights(tickIndex) {
    const which = ((tickIndex / 4) | 0) % 4;
    beatLights.forEach((el) => el.classList.remove('on'));
    const el = beatLights[which];
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 80);
  }

  function handleTick(tickIndex, bpm) {
    const msg = {
      type: 'tick',
      time: performance.now(),
      count: tickIndex,
      bpm: bpm,
      subdiv: SUBDIV,
      subIndex: tickIndex % 4,
      beat: Math.floor(tickIndex / 4),
      loopBeat: Math.floor(tickIndex / 4)
    };
    chan.postMessage(msg);
    if (currentMode === 'internal-ticker') {
      socket.send(JSON.stringify(msg));
    }
    // UI
    tickOut.textContent = String(tickIndex);
    beatOut.textContent = String(msg.beat);
    subOut.textContent = String(msg.subIndex);
    flashLights(tickIndex);
  }

  // ===== Sample-Accurate Scheduler =====
  function scheduleTicks() {
    if (!isPlaying || !ctx || currentMode !== 'internal-ticker') return;

    const bpm = getBPM();
    const T16 = sixteenthSecAtBPM(bpm);
    const swingPct = parseInt(swingInput.value, 10) || 0;
    const S16 = swingSec(bpm, swingPct);

    const aheadLimit = ctx.currentTime + LOOKAHEAD_SEC;

    while (nextTickCtxTime < aheadLimit) {
      const tickIndex = nextTickIndex;
      let fireTime = nextTickCtxTime;
      if (tickIndex % 2 === 1 && swingPct > 0) {
        fireTime += S16;
      }

      const src = new ConstantSourceNode(ctx, { offset: 0 });
      const gain = new GainNode(ctx, { gain: 0 });
      src.connect(gain).connect(ctx.destination);

      src.onended = () => {
        if (isPlaying) handleTick(tickIndex, bpm);
        release(src); release(gain);
      };

      const dur = Math.min(0.005, Math.max(0.001, T16 * 0.25));
      try {
        src.start(fireTime);
        src.stop(fireTime + dur);
        keep(src); keep(gain);
      } catch (_) {
        if (isPlaying) handleTick(tickIndex, bpm);
        release(src); release(gain);
      }

      nextTickIndex = (nextTickIndex + 1) % LOOP_TICKS;
      nextTickCtxTime += T16;
    }
  }

  function start() {
    if (isPlaying) return;

    if (currentMode === 'external-ticker') {
      isPlaying = true;
      playStateEl.textContent = 'Playing (external)';
      playBtn.textContent = 'Stop';
      return;
    }

    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const keepAlive = new GainNode(ctx, { gain: 0 });
      keepAlive.connect(ctx.destination);
      const dc = new ConstantSourceNode(ctx, { offset: 0 });
      dc.connect(keepAlive);
      dc.start();
    } else if (ctx.state === 'suspended') {
      ctx.resume();
    }

    const bpm = getBPM();
    const T16 = sixteenthSecAtBPM(bpm);

    isPlaying = true;
    playStateEl.textContent = 'Playing';
    playBtn.textContent = 'Pause';

    startCtxTime = ctx.currentTime;
    nextTickIndex = 0;
    nextTickCtxTime = startCtxTime;

    handleTick(0, bpm);
    nextTickIndex = 1;
    nextTickCtxTime = startCtxTime + T16;

    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(scheduleTicks, SCHED_INTERVAL_MS);
    scheduleTicks();
  }

  function stop() {
    if (!isPlaying) return;
    isPlaying = false;
    playStateEl.textContent = 'Stopped';
    playBtn.textContent = 'Play';
    if (currentMode === 'internal-ticker') {
      if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
      scheduledNodes.forEach(node => {
        try { node.onended = null; node.disconnect(); } catch {}
        try { node.stop(); } catch {}
      });
      scheduledNodes.clear();
    }
  }

  // ===== Events =====
  function syncBpmButtons() {
    const isInternal = currentMode === 'internal-ticker';
    const buttons = [bpmMinus10Btn, bpmPlus10Btn, bpmRandBtn];
    buttons.forEach((btn) => {
      if (!btn) return;
      btn.disabled = !isInternal;
      btn.style.display = isInternal ? '' : 'none';
    });
  }

  playBtn.addEventListener('click', (e) => {
    e.preventDefault();
    if (isPlaying) stop(); else start();
  });

  if (stopBtn) stopBtn.addEventListener('click', stop);

  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    const isTyping = tag === 'input' || tag === 'textarea' || e.isComposing;
    if (e.code === 'Space') {
      e.preventDefault();
      if (isPlaying) stop(); else start();
    } else if (!isTyping && (e.code === 'KeyP')) {
      if (isPlaying) stop(); else start();
    }
  });

  bpmInput.addEventListener('input', updateDerivedUI);
  swingInput.addEventListener('input', updateDerivedUI);

  if (bpmMinus10Btn) bpmMinus10Btn.addEventListener('click', () => {
    if (currentMode !== 'internal-ticker') return;
    setBpmThroughInput(getBPM() - 10);
  });
  if (bpmPlus10Btn) bpmPlus10Btn.addEventListener('click', () => {
    if (currentMode !== 'internal-ticker') return;
    setBpmThroughInput(getBPM() + 10);
  });
  if (bpmRandBtn) bpmRandBtn.addEventListener('click', () => {
    if (currentMode !== 'internal-ticker') return;
    const v = 85 + Math.floor(Math.random() * (175 - 85 + 1));
    setBpmThroughInput(v);
  });

  modeSelect.addEventListener('change', (e) => {
    currentMode = e.target.value;
    channelOut.textContent = currentMode;
    if (currentMode === 'external-ticker' && !socketOpen) {
      alert("WebSocket not connected. Check server.");
    }
    syncBpmButtons();
  });

  // ===== Broadcast Channel =====
  const chan = new BroadcastChannel('internal-ticker');

  // ===== WebSocket =====
  let currentMode = 'internal-ticker';
  const socket = new WebSocket("ws://localhost:8081");
  let socketOpen = false;

  socket.onopen = () => {
    socketOpen = true;
    console.log("WebSocket connected");
  };
  socket.onclose = () => {
    socketOpen = false;
    console.log("WebSocket disconnected");
  };
  socket.onerror = (e) => {
    console.error("WebSocket error:", e);
  };

  // Gestion des messages WebSocket entrants
  socket.addEventListener('message', (event) => {
    if (currentMode !== 'external-ticker') return;
    const data = JSON.parse(event.data);

    if (data.type === 'tick') {
      handleTick(data.count, data.bpm);
    }

    // Mise à jour du BPM si présent dans le message
    if (data.bpm !== undefined) {
      bpmInput.value = data.bpm;
      bpmOut.textContent = String(data.bpm);
      updateDerivedUI(); // Met à jour les valeurs dérivées (ex: ms par 16ème)
    }
      if (data.type === 'randomize') { // envoie randomize si randomize vient de live
      randomizeChannel.postMessage({
        type: 'randomize_all'
      });
    }
  });
/////--- Randomize ALL Braodcast //////
   // Créer un BroadcastChannel pour communiquer avec les autres pages
    const randomizeChannel = new BroadcastChannel('randomize_channel');

    // Écouteur pour le bouton Randomize All
    document.getElementById("randomizeAll").addEventListener("click", function() {
      if (currentMode === 'internal-ticker') {
        const v = 85 + Math.floor(Math.random() * (175 - 85 + 1));
        setBpmThroughInput(v);
      }
      // Envoyer un message via le BroadcastChannel
      randomizeChannel.postMessage({
        type: 'randomize_all'
      });
      console.log("Message 'randomize_all' envoyé via BroadcastChannel.");
    });

  // Fonction pour randomiser les patterns (à adapter)
  function randomizeAllPatterns() {
    console.log("Randomisation de tous les patterns...");
    // Implémente ici ta logique de randomisation
  }
//////////////////////////////////////////////////////

  /* =========================================================
     Minimal UI toggle behavior (UI-only, no scheduler changes)
     - Single visible button: #playBtn
     - If currently playing, click routes to hidden #stopBtn
     - Never show "Restart" label; show "Play"/"Stop" only
     ========================================================= */
  function minuiIsPlaying() {
    const t = (playStateEl.textContent || '').toLowerCase();
    return t.startsWith('playing');
  }
  function minuiSyncToggleLabel() {
    playBtn.textContent = minuiIsPlaying() ? 'Pause' : 'Play';
  }




  // Also sync when play state changes (internal updates + external mode)
  const mo = new MutationObserver(() => minuiSyncToggleLabel());
  mo.observe(playStateEl, { childList: true, characterData: true, subtree: true });

  // Init UI
  updateDerivedUI();
  syncBpmButtons();
  minuiSyncToggleLabel();
})();
</script>
</body>
</html>
