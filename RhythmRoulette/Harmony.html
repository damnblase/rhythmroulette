(() => {
  // -------------------- User-specified minor-only progression library --------------------
  const PROGRESSIONS = [
    ["i","iv"], ["i","v"], ["iv","v"], ["v","iv"],
    ["i","iv","v"], ["i","v","iv"], ["iv","i","v"], ["iv","v","i"], ["v","i","iv"], ["v","iv","i"],
    ["i","iv","v","i"], ["i","v","iv","i"], ["iv","i","v","iv"], ["v","i","iv","v"], ["i","iv","i","v"], ["iv","v","iv","i"], ["v","iv","v","i"],
  ];

// -------------------- Key & Harmony (MAJOR + MINOR) --------------------
const KEYS = (() => {
  const names = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
  const semis = { C:0, "C#":1, Db:1, D:2, Eb:3, E:4, F:5, "F#":6, Gb:6, G:7, Ab:8, A:9, Bb:10, B:11 };
  
  // intervalles pour les modes
  const naturalMinor = [0,2,3,5,7,8,10]; // tonique, 2, b3, 4, 5, b6, b7

  // --- MAJOR MODE DISABLED (commented for easy restore) ---
  // const naturalMajor = [0,2,4,5,7,9,11]; // tonique, 2, 3, 4, 5, 6, 7

  const records = [];
  for (const n of names) {
    // minor key
    records.push({ 
      name:`${n} Minor`, 
      tonicName:n, 
      tonic:semis[n], 
      mode:'minor', 
      scale:naturalMinor 
    });
    // --- MAJOR KEYS DISABLED (commented for easy restore) ---
    // // major key
    // records.push({ 
    //   name:`${n} Major`, 
    //   tonicName:n, 
    //   tonic:semis[n], 
    //   mode:'major', 
    //   scale:naturalMajor 
    // });
  }
  return records;
})();

// pick random helper
function pickRandom(arr){ 
  const i = Math.floor(Math.random()*arr.length); 
  return arr[i]; 
}

// random int helper
function randInt(min,max){ 
  return Math.floor(Math.random()*(max-min+1))+min; 
}

// -------------------- Parsing Roman numerals --------------------
function parseRomanToken(tok){
  tok = tok.replace(/b/g,"♭").replace(/#/g,"#");
  let acc = 0;
  while (tok.startsWith("♭") || tok.startsWith("#")) {
    if (tok.startsWith("♭")) { acc -= 1; tok = tok.slice(1); }
    else if (tok.startsWith("#")) { acc += 1; tok = tok.slice(1); }
  }
  let diminished = tok.includes("°");
  let augmented = tok.includes("+");
  tok = tok.replace(/[°+]/g,"");
  const ROM = { I:1, II:2, III:3, IV:4, V:5, VI:6, VII:7 };
  const upper = tok.toUpperCase();
  const deg = ROM[upper] || 1;
  const isUpper = tok === upper;
  const quality = augmented ? 'aug' : diminished ? 'dim' : (isUpper ? 'maj' : 'min');
  return { degree:deg, acc, quality, raw:tok, isUpper };
}

// -------------------- Build Chord MIDI --------------------
function buildChordMidi(token, key, add7=false, add9=false){
  const t = parseRomanToken(token);
  const scale = key.scale; // tableau de 7 notes pour le mode
  const degIndex = (t.degree - 1) % 7;
  let rootPC = (key.tonic + scale[degIndex] + t.acc) % 12;
  if (rootPC < 0) rootPC += 12;

  // Triade basée sur l'échelle
  const thirdIndex = (degIndex + 2) % 7;
  const fifthIndex = (degIndex + 4) % 7;
  let triad = [
    rootPC,
    (key.tonic + scale[thirdIndex] + t.acc) % 12,
    (key.tonic + scale[fifthIndex] + t.acc) % 12
  ];

  // Ajuster les intervalles pour les altérations (dim/aug)
  if (t.quality === 'dim') triad[2] = (triad[0] + 6) % 12;
  if (t.quality === 'aug') triad[2] = (triad[0] + 8) % 12;

  // Ajouter 7 et 9 si demandé
  let tones = triad.slice();
  if (add7) {
    let seventh;
    if (t.quality === 'dim') seventh = (triad[0]+10)%12;
    else if (t.isUpper && t.degree===5 && t.acc===0) seventh = (triad[0]+10)%12;
    else if (t.quality==='min') seventh = (triad[0]+10)%12;
    else seventh = (triad[0]+11)%12;
    tones.push(seventh);
    if (add9) tones.push((triad[0]+14)%12);
  }

  // Convertir en notes MIDI dans la plage
  const rootBase = nearestInRange(rootPC, 50, 60);
  let notes = tones.map(n => rootBase + ((n - rootPC + 12) % 12));

  // Ajuster si hors limites
  let maxN = Math.max(...notes), minN = Math.min(...notes);
  if (maxN > 84) notes = notes.map(n => n-12);
  if (minN < 45) notes = notes.map(n => n+12);

  const seen = new Set();
  notes = notes.filter(n => { const pc = (n%12+12)%12; if (seen.has(pc)) return false; seen.add(pc); return true; });

  return notes;
}


// -------------------- Helpers --------------------
function nearestInRange(pc, lo, hi){
  let best = lo - ((lo - pc) % 12);
  while (best < lo) best += 12;
  while (best > hi) best -= 12;
  if (best < lo) best += 12;
  if (best > hi) best -= 12;
  return best;
}

function pcToNearestMidi(pc, lo=54, hi=66){ 
  return nearestInRange(pc, lo, hi); 
}


  // -------------------- Boundaries (internal ticks with jitter) --------------------
  function baseTickBoundariesFor(N, loopBeats){
    const totalTicks = 4*loopBeats;
    const b = [];
    for (let k=0;k<=N;k++) b.push(Math.round(k*totalTicks/N));
    return b;
  }

  function applyJitter(baseB, maxJ){
    const N = baseB.length-1;
    const total = baseB[N];
    const Bp = baseB.slice();
    if (maxJ <= 0 || N <= 1) return Bp;

    for (let k=1;k<=N-1;k++){
      const d = randInt(-maxJ, maxJ);
      Bp[k] = baseB[k] + d;
    }

    Bp[0] = 0; Bp[N] = total;
    for (let k=1;k<=N-1;k++){
      const lo = Bp[k-1] + 1;
      const hi = Math.min(baseB[k] + maxJ, Bp[k+1] ?? (total)) - 1;
      if (Bp[k] < lo) Bp[k] = lo;
      if (Bp[k] > hi) Bp[k] = hi;
    }
    for (let k=N-1;k>=1;k--){
      const hi = Bp[k+1] - 1;
      if (Bp[k] > hi) Bp[k] = hi;
      const lo = Bp[k-1] + 1;
      if (Bp[k] < lo) Bp[k] = lo;
    }
    return Bp;
  }

  function snapInnerToEighths(bounds){
    const S = bounds.slice();
    const N = S.length - 1;
    if (N <= 1) return S;

    for (let k=1; k<=N-1; k++){
      let lo = S[k-1] + 1;
      let hi = S[k+1] - 1;
      let t  = Math.round(S[k] / 2) * 2;

      if (t < lo) t = lo;
      if (t > hi) t = hi;

      if (t % 2 !== 0){
        if (t + 1 <= hi) t = t + 1;
        else if (t - 1 >= lo) t = t - 1;
      }
      S[k] = t;
    }

    for (let k=N-1; k>=1; k--){
      if (S[k] >= S[k+1]) S[k] = S[k+1] - 1;
      if (S[k] % 2 !== 0){
        if (S[k] - 1 > S[k-1]) S[k] = S[k] - 1;
        else S[k] = S[k] + 1;
      }
    }
    return S;
  }

  function chordIndexForTick(itick, boundsTicks){
    for (let k=0;k<boundsTicks.length-1;k++){
      if (itick >= boundsTicks[k] && itick < boundsTicks[k+1]) return k;
    }
    return boundsTicks.length-2;
  }

  // -------------------- MIDI --------------------
  const MIDI = {
    // MIDI channel UI
        access:null, out:null, channel:0, noteOnVel:96,
    async init(){
      try{
        this.access = await navigator.requestMIDIAccess({ sysex:false });
        this.refreshOutputs();
        document.getElementById('midiStatus').textContent = 'Connected';
        // Rescan a few times in case ports appear shortly after permission.
        let tries = 0;
        const kick = () => {
          tries++;
          this.refreshOutputs();
          if (this.outputs().length === 0 && tries < 6) setTimeout(kick, 150 * tries);
        };
        setTimeout(kick, 50);
        this.access.onstatechange = ()=> this.refreshOutputs();
      }catch(err){
        document.getElementById('midiStatus').textContent = 'MIDI unavailable';
        console.warn('WebMIDI not available', err);
      }
    },
    refreshOutputs(){
      const sel = document.getElementById('midiOut');
      const oldId = sel.value;
      sel.innerHTML = '';
      const outs = this.outputs();
      outs.forEach(o=>{
        const opt=document.createElement('option');
        opt.value=o.id; opt.textContent=o.name; sel.appendChild(opt);
      });
      if (outs.length===0){
        const opt=document.createElement('option'); opt.value=''; opt.textContent='(no outputs)'; sel.appendChild(opt);
        this.out=null;
        sel.disabled = true;
      } else {
        const pick = outs.find(o=>o.id===oldId) || outs[0];
        sel.value = pick.id;
        this.out = pick;
        sel.disabled = false;
      }
    },
    outputs(){
      if (!this.access) return [];
      return Array.from(this.access.outputs.values());
    },
    selectById(id){
      const outs = this.outputs();
      this.out = outs.find(o=>o.id===id) || null;
    },
    send(bytes){ if (this.out) this.out.send(bytes); },
    noteOn(note){ this.send([0x90 + this.channel, note & 0x7F, this.noteOnVel]); },
    noteOff(note){ this.send([0x80 + this.channel, note & 0x7F, 0]); },
    // keep generic helpers (used for Ch.2 root); DO NOT call with ch=2 (Ch.3) anywhere.
    noteOnCh(note, ch){ this.send([0x90 + (ch & 0x0F), note & 0x7F, this.noteOnVel]); },
    noteOffCh(note, ch){ this.send([0x80 + (ch & 0x0F), note & 0x7F, 0]); },
    allNotesOff(){
      for (let ch=0; ch<16; ch++) if (this.out) this.out.send([0xB0+ch,123,0]);
      if (this.out){ for (let n=0;n<128;n++){ this.out.send([0x80+this.channel,n,0]); } }
    }
  };

  // -------------------- App State --------------------
  const LOOP_CHOICES = [4,8,16];
  const state = {
    progression: pickRandom(PROGRESSIONS),
    keySource: 'manual',
    key: null,
    add7: false,
    add9: false,
    loopBeats: pickRandom(LOOP_CHOICES),
    boundsTicks: [],
    baseBoundsTicks: [],
    jitterEnabled: true,
    jitterMax: 4,
    jitterDeltas: [],
    currentChordIndex: -1,
    currentNotes: [],           // Ch.1 notes
    // (CH3 MIRROR REMOVED) currentNotesCh3: [],
    currentRootCh2: -1,         // Ch.2 root note
    pending: { progression:null, key:null, loopBeats:null, rejitter:false, jitterEnabled:null, jitterMax:null },
    lastTick:-1,
    silenceTimer:null,
    bpm: 120,
    hiSpeed: false,
    // ---- Syncopated chord re-strikes (persistent per progression) ----
    repeatOffsets: [],        // per-chord: array of relative tick offsets within chord window (excluding 0)
    repeatTicksAbs: [],        // per-chord: array of absolute internal ticks (computed from boundsTicks)
    repeatTickSets: [],        // per-chord: Set for fast lookup (rebuilt from repeatTicksAbs)
  };

  // Default key: C Minor
  state.key = KEYS.find(k => k.tonicName === 'C' && k.mode === 'minor') || pickRandom(KEYS);

  recomputeBoundariesAndJitter(true);
  regenerateRepeatOffsetsForCurrentProgression();
// ------------------- Key ws ---------------
  let keyWS = null;

function startKeyWS(){
  if (keyWS) return;

  keyWS = new WebSocket('ws://localhost:8081');

  keyWS.onopen = () => {
    console.log('[KEY WS] connected');
    document.getElementById('keyExtStatus').style.display = 'inline-block';
  };

keyWS.onmessage = (ev) => {
  if (state.keySource !== 'external') return;

  try {
    const msg = JSON.parse(ev.data);

    if (msg.type === 'key') {
      let k = null;

      // Minor-only enforcement:
      // - If an external MAJOR key is received, convert it to its relative minor (e.g., C Major -> A Minor).
      // - If the key cannot be resolved to a minor key, ignore it.
      const incomingMode = (typeof msg.mode === 'string') ? msg.mode.toLowerCase() : 'minor';

      // helpers kept local to avoid refactors
      const nameToPc = { C:0, "C#":1, Db:1, D:2, Eb:3, "D#":3, E:4, F:5, "F#":6, Gb:6, G:7, Ab:8, "G#":8, A:9, Bb:10, "A#":10, B:11 };
      const majorToRelativeMinorPc = (pc) => (pc + 9) % 12;

      let tonicPc = null;
      if (typeof msg.tonicPc === 'number') tonicPc = ((msg.tonicPc % 12) + 12) % 12;
      else if (typeof msg.tonic === 'string' && nameToPc[msg.tonic] != null) tonicPc = nameToPc[msg.tonic];

      if (tonicPc !== null && incomingMode === 'major') tonicPc = majorToRelativeMinorPc(tonicPc);

      // Find matching MINOR key only (major keys are disabled in KEYS)
      if (tonicPc !== null) {
        k = KEYS.find(x => x.tonic === tonicPc && x.mode === 'minor');
      }

      if (k) {
        state.pending.key = k;

        // Optionnel : log pour vérifier
        console.log('[KEY WS] Key updated:', k.name);
      }
    }
  } catch (e) {
    console.warn('[KEY WS] invalid message', ev.data);
  }
};



  keyWS.onclose = () => {
    console.log('[KEY WS] closed');
    keyWS = null;
    document.getElementById('keyExtStatus').style.display = 'none';
  };

  keyWS.onerror = (e) => {
    console.warn('[KEY WS] error', e);
  };
}

function stopKeyWS(){
  if (keyWS){
    keyWS.close();
    keyWS = null;
  }
  document.getElementById('keyExtStatus').style.display = 'none';
}



  // -------------------- KEY BROADCAST --------------------petit hack pour le mode
const keyBC = new BroadcastChannel('music-key');

function publishKey(k){
  if (!k) return;

  // --- MAJOR MODE DISABLED (commented for easy restore) ---
  // hack minimal : déduire le mode depuis le nom
  // const mode = /major/i.test(k.name) ? 'major' : 'minor';
  const mode = 'minor';

  const msg = {
    type: 'key',
    tonic: k.tonicName,
    mode,                  // ← maintenant vrai
    tonicPc: k.tonic,
    tonicMidi: pcToNearestMidi(k.tonic, 54, 66)
  };

  try {
    keyBC.postMessage(msg);
  } catch(e){
    console.warn('music-key postMessage failed', e);
  }
}

  function silenceAll(reason='silence'){
    // turn off existing Ch.1 notes
    for (const n of state.currentNotes) MIDI.noteOff(n);
    // (CH3 OFF) no Channel 3 note-offs here
    if (state.currentRootCh2 >= 0) MIDI.noteOffCh(state.currentRootCh2, 1); // Ch.2
    MIDI.allNotesOff(); // global safety, allowed by acceptance criteria

    state.currentNotes = [];
    // (CH3 OFF) state.currentNotesCh3 = [];
    state.currentRootCh2 = -1;
    state.currentChordIndex = -1;
    if (state.silenceTimer) { clearTimeout(state.silenceTimer); state.silenceTimer=null; }
    const np = document.getElementById('nowPlaying'); if (np) np.textContent = `— (${reason})`;
  }

  function scheduleSilenceGuard(tickMs){
    const minDelay = 150;
    const maxDelay = 1200;
    const delay = Math.min(Math.max((tickMs||120) * 2.5, minDelay), maxDelay);
    if (state.silenceTimer) clearTimeout(state.silenceTimer);
    state.silenceTimer = setTimeout(()=> silenceAll('transport stopped'), delay);
  }

  // -------------------- UI wiring --------------------
  const el = {
    midiOut: document.getElementById('midiOut'),
    randProg: document.getElementById('randProg'),
    randKey: document.getElementById('randKey'),
    keySelect: document.getElementById('keySelect'),
    add7: document.getElementById('add7'),
    add9: document.getElementById('add9'),
    progLabel: document.getElementById('progLabel'),
    loopLen: document.getElementById('loopLen'),
    loopInfo: document.getElementById('loopInfo'),
    enableJitter: document.getElementById('enableJitter'),
    jitterMax: document.getElementById('jitterMax'),
    jitterInfo: document.getElementById('jitterInfo'),
    randGroove: document.getElementById('randGroove'),
    placementInfo: document.getElementById('placementInfo'),
  };

  function refreshKeySelect(){
    el.keySelect.innerHTML='';
    KEYS.forEach((k,idx)=>{
      const o=document.createElement('option'); o.value=idx; o.textContent=k.name; el.keySelect.appendChild(o);
    });
    el.keySelect.value = KEYS.indexOf(state.key);
  }
  function fmtProg(p){ return p.join(' – '); }
  function refreshProgLabel(){ el.progLabel.textContent = `[ ${fmtProg(state.progression)} ]  (${state.progression.length} chords)`; }
  function refreshLoopUI(){
    el.loopLen.value = String(state.loopBeats);
    if (el.st_loopLen) el.st_loopLen.textContent = state.loopBeats;
    const per = (state.loopBeats / state.progression.length).toFixed(2);
    el.loopInfo.textContent = `${state.loopBeats} beats • ~${per} beats/chord`;
  }
  function refreshJitterUI(){
    el.enableJitter.checked = state.jitterEnabled;
    el.jitterMax.value = state.jitterMax;
    if (el.jitterInfo) el.jitterInfo.textContent = `Jitter: ${state.jitterEnabled ? 'ON' : 'OFF'} ${state.jitterEnabled ? `±${state.jitterMax}` : ''}`;
    if (el.st_deltas) el.st_deltas.textContent = state.jitterDeltas.length ? `[${state.jitterDeltas.join(', ')}]` : '—';
  }
  function refreshPlacementUI(){
    if (!el.placementInfo) return;
    if (state.hiSpeed){
      if (el.placementInfo) el.placementInfo.textContent = 'Placement: 8ths (down & up)';
      if (el.placementInfo) el.placementInfo.style.borderColor = '#2b7';
    } else {
      if (el.placementInfo) el.placementInfo.textContent = 'Placement: 16ths (full options)';
      if (el.placementInfo) el.placementInfo.style.borderColor = '#22313e';
    }
  }

  function applyPendingIfBoundary(tick, itick){
    const atLoopStart = (tick===0);
    const idxNow = chordIndexForTick(itick, state.boundsTicks);
    const atChordBoundary = (state.currentChordIndex !== idxNow);
    if (atLoopStart || atChordBoundary){
      let rebound=false;
      let progressionChanged = false;
      if (state.pending.progression){ state.progression = state.pending.progression; state.pending.progression=null; rebound=true; progressionChanged = true; }
      if (state.pending.key){
        state.key = state.pending.key; state.pending.key=null; el.keySelect.value = KEYS.indexOf(state.key);
        publishKey(state.key);
      }
      if (state.pending.loopBeats){ state.loopBeats = state.pending.loopBeats; state.pending.loopBeats=null; rebound=true; }
      if (state.pending.jitterEnabled !== null){ state.jitterEnabled = !!state.pending.jitterEnabled; state.pending.jitterEnabled=null; rebound=true; }
      if (state.pending.jitterMax !== null){ state.jitterMax = Math.max(0, Math.min(8, state.pending.jitterMax|0)); state.pending.jitterMax=null; rebound=true; }
      if (state.pending.rejitter){ state.pending.rejitter=false; rebound=true; }
      if (rebound){
        recomputeBoundariesAndJitter();
        // Repeat patterns must persist loop-to-loop and change only when progression changes.
        if (progressionChanged){
          regenerateRepeatOffsetsForCurrentProgression();
        }
        refreshProgLabel();
        refreshLoopUI();
        refreshJitterUI();
        refreshPlacementUI();
      }
    }
  }

  function setAdd7(v){ state.add7 = !!v; el.add9.disabled = !state.add7; if (!state.add7) { state.add9=false; el.add9.checked=false; } }

  function recomputeBoundariesAndJitter(initial=false){
    state.baseBoundsTicks = baseTickBoundariesFor(state.progression.length, state.loopBeats);

    let B = state.baseBoundsTicks;
    if (state.jitterEnabled && state.jitterMax > 0 && state.progression.length > 1){
      const Bp = applyJitter(B, state.jitterMax);
      B = Bp;
      state.jitterDeltas = state.baseBoundsTicks.map((b,i)=> (i===0||i===state.baseBoundsTicks.length-1) ? 0 : (Bp[i]-b));
    } else {
      state.jitterDeltas = [];
    }

    if (state.hiSpeed && B.length > 2){
      B = snapInnerToEighths(B);
    }

    state.boundsTicks = B.slice();

    // repeat lookups depend on bounds; keep patterns stable, only recompute absolute tick positions
    if (Array.isArray(state.repeatOffsets) && state.repeatOffsets.length){
      rebuildRepeatTickLookups();
    }

    if (!initial){
      state.currentChordIndex = -1;
    }
  }

  // -------------------- Syncopated chord repeat patterns (persistent across loops) --------------------
  function buildSyncopatedOffsetsForWindow(lenTicks){
    // lenTicks is chord window length in ticks (end-start)
    // Returns an array of relative offsets (1..lenTicks-1) to re-strike.
    // "Syncopated" bias: prefer off-beat ticks (odd 16ths) over strong beats.
    if (lenTicks <= 2) return []; // nothing sensible

    // Decide whether this chord has repeats at all
    const pNo = 0.60; // majority of chords = no repeats
    if (Math.random() < pNo) return [];

    // Max repeats scales gently with window size but stays modest
    const maxRepeats = Math.max(1, Math.min(3, Math.floor((lenTicks - 1) / 3)));
    const nRepeats = 1 + Math.floor(Math.random() * maxRepeats);

    // Build weighted candidate list
    const candidates = [];
    const weights = [];
    for (let o = 1; o < lenTicks; o++){
      // exclude the very last tick of the window to avoid "kissing" the next boundary
      if (o === lenTicks - 1) continue;

      const absIsBeat = (o % 4 === 0);
      const absIsEighth = (o % 2 === 0);

      // Strong-beat penalty, offbeat preference
      let w = 1;
      if (absIsBeat) w = 0.10;
      else if (absIsEighth) w = 0.45;
      else w = 1.0; // odd 16ths

      // Avoid immediate retrigger right after the chord boundary for clarity
      if (o === 1) w *= 0.35;

      if (w > 0){
        candidates.push(o);
        weights.push(w);
      }
    }

    if (!candidates.length) return [];

    // Sample without replacement using weights
    const out = [];
    const used = new Set();
    for (let k=0; k<nRepeats; k++){
      let total = 0;
      for (let i=0;i<candidates.length;i++){
        if (!used.has(i)) total += weights[i];
      }
      if (total <= 0) break;

      let r = Math.random() * total;
      let pickI = -1;
      for (let i=0;i<candidates.length;i++){
        if (used.has(i)) continue;
        r -= weights[i];
        if (r <= 0){ pickI = i; break; }
      }
      if (pickI < 0) break;
      used.add(pickI);
      out.push(candidates[pickI]);
    }

    out.sort((a,b)=>a-b);
    return out;
  }

  function regenerateRepeatOffsetsForCurrentProgression(){
    // Generate per-chord offsets ONCE per progression (persistent until progression changes)
    const N = state.progression.length;
    state.repeatOffsets = new Array(N);
    for (let k=0;k<N;k++){
      const start = state.boundsTicks[k] ?? 0;
      const end   = state.boundsTicks[k+1] ?? (4*state.loopBeats);
      const len   = Math.max(0, (end - start)|0);
      state.repeatOffsets[k] = buildSyncopatedOffsetsForWindow(len);
    }
    rebuildRepeatTickLookups(); // derive abs ticks + sets
  }

  function rebuildRepeatTickLookups(){
    // Recompute absolute ticks + sets based on current boundsTicks and stored relative offsets
    const N = state.progression.length;
    state.repeatTicksAbs = new Array(N);
    state.repeatTickSets = new Array(N);
    for (let k=0;k<N;k++){
      const start = state.boundsTicks[k] ?? 0;
      const end   = state.boundsTicks[k+1] ?? (4*state.loopBeats);
      const len   = Math.max(0, (end - start)|0);
      const offs  = Array.isArray(state.repeatOffsets[k]) ? state.repeatOffsets[k] : [];
      const abs   = [];
      for (const o of offs){
        const oo = o|0;
        if (oo > 0 && oo < len && oo !== (len - 1)){
          abs.push(start + oo);
        }
      }
      state.repeatTicksAbs[k] = abs;
      state.repeatTickSets[k] = new Set(abs);
    }
  }


  // -------------------- Playback engine (driven by external ticks) --------------------
  function processTick(msg){
    const t = msg.count|0;
    const extBeat = (typeof msg.loopBeat === 'number' ? msg.loopBeat|0 : Math.floor(t/4)) % 32;
    const iBeat = extBeat % state.loopBeats;
    const iTick = ((t % 128) % (4*state.loopBeats));

    if (el.st_count) el.st_count.textContent = t;
    if (el.st_beat) el.st_beat.textContent = extBeat;
    if (el.st_iBeat) el.st_iBeat.textContent = iBeat;
    if (el.st_iTick) el.st_iTick.textContent = iTick;
    if (el.st_bpm) el.st_bpm.textContent = msg.bpm != null ? Math.round(msg.bpm) : '—';

    const bpm = (msg.bpm && msg.bpm>0) ? msg.bpm : 120;
    const subdiv = (msg.subdiv && msg.subdiv>0) ? msg.subdiv : 4;
    const tickMs = 60000 / (bpm * subdiv);
    scheduleSilenceGuard(tickMs);

    const prevHi = state.hiSpeed;
    state.bpm = bpm;
    state.hiSpeed = bpm > 130;
    if (state.hiSpeed !== prevHi){
      recomputeBoundariesAndJitter();
      refreshPlacementUI();
    }

    if (state.lastTick === -1) {
      if (t !== 0) { state.lastTick = t; return; }
    }

    applyPendingIfBoundary(t, iTick);

    const idx = chordIndexForTick(iTick, state.boundsTicks);

    const boundaryChange = (t===0) || (idx !== state.currentChordIndex);
    if (boundaryChange){
      // NOTE-OFFS for previous chord
      for (const n of state.currentNotes) MIDI.noteOff(n);                 // Ch.1
      // (CH3 OFF) no noteOffs on Ch.3
      if (state.currentRootCh2 >= 0) MIDI.noteOffCh(state.currentRootCh2, 1); // Ch.2

      const rn = state.progression[idx];
      const notes = buildChordMidi(rn, state.key, state.add7, state.add9);

      // Ch.1 chord (unchanged)
      state.currentNotes = notes;
      state.currentChordIndex = idx;
      for (const n of notes) MIDI.noteOn(n);

      // (CH3 OFF) — removed mirroring the full chord on Channel 3

      // Ch.2 root-only (unchanged)
      state.currentRootCh2 = (notes.length ? notes[0] : -1);
      if (state.currentRootCh2 >= 0) MIDI.noteOnCh(state.currentRootCh2, 1); // 0-based idx 1 = Ch.2

      const chordName = describeChord(rn, state.key, state.add7, state.add9);
      const np = document.getElementById('nowPlaying'); if (np) np.textContent = `Chord ${idx+1}/${state.progression.length}: ${rn} → ${chordName}`;
    }
    // Syncopated re-strikes inside the active chord window (strictly on the tick grid)
    if (!boundaryChange){
      const set = state.repeatTickSets && state.repeatTickSets[idx];
      if (set && set.has(iTick)){
        // Re-trigger same chord: NOTE OFF then NOTE ON (audible repeat), keep channels unchanged
        for (const n of state.currentNotes) MIDI.noteOff(n);                 // Ch.1
        if (state.currentRootCh2 >= 0) MIDI.noteOffCh(state.currentRootCh2, 1); // Ch.2

        for (const n of state.currentNotes) MIDI.noteOn(n);                  // Ch.1
        if (state.currentRootCh2 >= 0) MIDI.noteOnCh(state.currentRootCh2, 1); // Ch.2
      }
    }



    state.lastTick = t;
  }

  function describeChord(token, key, add7, add9){
    const t = parseRomanToken(token);
    const degIndex = (t.degree - 1) % 7;
    const baseScale = key.scale;
    let rootPC = (key.tonic + baseScale[degIndex] + t.acc) % 12; if (rootPC<0) rootPC+=12;
    const name12 = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
    const rootName = name12[rootPC];
    const isDominant = t.isUpper && t.degree===5 && t.acc===0;
    let q = (t.quality==='maj' ? '' : t.quality==='min' ? 'm' : t.quality==='dim' ? 'dim' : 'aug');
    if (q==='dim') q='m♭5';
    let ext = '';
    if (add7){
      if (t.quality==='dim') ext='7♭5';
      else if (isDominant) ext='7';
      else if (t.quality==='min') ext='7';
      else ext='maj7';
      if (add9) ext += ' (add9)';
    }
    return `${rootName}${q}${ext ? ' '+ext : ''}`.trim();
  }

  // -------------------- BroadcastChannel subscription --------------------
  function initTicker(){
    const bc = new BroadcastChannel('internal-ticker');
    bc.onmessage = ev => {
      const m = ev.data || {};
      if (!m) return;
      if (m.type === 'tick') {
        processTick(m);
      } else if ((m.type === 'transport' && (m.state === 'stopped' || m.play === false)) || m.type === 'stop') {
        silenceAll('transport stop');
      }
    };
  }

  // -------------------- BroadcastChannel-triggered harmony randomization --------------------
  function initRandomizeChannel(){
    const randomizeChannel = new BroadcastChannel('randomize_channel');
    randomizeChannel.onmessage = (event) => {
      if (event && event.data && event.data.type === 'randomize_all') {
        console.log("Message 'randomize_all' reçu !");

        // A) Trigger existing randomize buttons
        const bRandProg = document.getElementById('randProg');
        const bRandKey = document.getElementById('randKey');
        const bRandGroove = document.getElementById('randGroove');
        if (bRandProg) bRandProg.click();
        if (bRandKey) bRandKey.click();
        if (bRandGroove) bRandGroove.click();

        // B) Randomize chord extension checkboxes (flow through existing wiring)
        const cb7 = document.getElementById('add7');
        const cb9 = document.getElementById('add9');
        if (cb7 && cb9) {
          const v7 = Math.random() < 0.5;
          cb7.checked = v7;
          cb7.dispatchEvent(new Event('change', { bubbles: true }));

          let v9 = Math.random() < 0.5;
          if (!v7) v9 = false;
          cb9.checked = v9;
          cb9.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // C) Randomize progression / loop length
        const selLoop = document.getElementById('loopLen');
        if (selLoop) {
          const vals = ['4','8','16'];
          selLoop.value = vals[Math.floor(Math.random() * vals.length)];
          selLoop.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    };
  }

  // -------------------- Event bindings --------------------
  function bindUI(){
    el.midiOut.addEventListener('change', e=> MIDI.selectById(e.target.value));

    el.randProg.addEventListener('click', ()=>{
      let next; do { next = pickRandom(PROGRESSIONS); } while (next === state.progression && PROGRESSIONS.length>1);
      state.pending.progression = next;
      state.pending.rejitter = true;
    });

    el.randKey.addEventListener('click', ()=>{
    if (state.keySource !== 'manual') return;
    let next; do { next = pickRandom(KEYS); } while (next === state.key && KEYS.length>1);
    state.pending.key = next;
    });

    el.keySelect.addEventListener('change', e=>{
    if (state.keySource !== 'manual') return;
    const idx = parseInt(e.target.value,10) || 0;
    state.pending.key = KEYS[idx];
    });


    el.add7.addEventListener('change', e=> setAdd7(e.target.checked));
    el.add9.addEventListener('change', e=> state.add9 = !!e.target.checked);

    el.loopLen.addEventListener('change', e=>{
      const L = parseInt(e.target.value,10);
      if (![4,8,16].includes(L)) return;
      state.pending.loopBeats = L;
      state.pending.rejitter = true;
    });

    el.enableJitter.addEventListener('change', e=>{
      state.pending.jitterEnabled = e.target.checked;
      state.pending.rejitter = true;
    });
    el.jitterMax.addEventListener('change', e=>{
      const J = parseInt(e.target.value,10);
      state.pending.jitterMax = isFinite(J) ? Math.max(0, Math.min(8, J)) : 4;
      state.pending.rejitter = true;
    });
    el.randGroove.addEventListener('click', ()=>{
      state.pending.rejitter = true;
    });
    const keySourceSel = document.getElementById('keySource');

    keySourceSel.addEventListener('change', e => {
    state.keySource = e.target.value;
  
    if (state.keySource === 'external'){
      el.keySelect.disabled = true;
      el.randKey.disabled = true;
      startKeyWS();
    } else {
      el.keySelect.disabled = false;
      el.randKey.disabled = false;
      stopKeyWS();
    }
});

  }

  // -------------------- Boot --------------------
  function boot(){
    refreshKeySelect();
    refreshProgLabel();
    refreshLoopUI();
    refreshJitterUI();
    refreshPlacementUI();
    setAdd7(false);
    bindUI();
    const midiChSel = document.getElementById('midiCh');
const chLabel = document.getElementById('chLabel');
fillChannelSelect(midiChSel, 1);
MIDI.channel = readChannel0(midiChSel);
if (chLabel) chLabel.textContent = String(parseInt(midiChSel.value,10)||1);
midiChSel.addEventListener('change', ()=>{
  MIDI.channel = readChannel0(midiChSel);
  if (chLabel) chLabel.textContent = String(parseInt(midiChSel.value,10)||1);
});

    MIDI.init();
    initTicker();
    initRandomizeChannel();
    publishKey(state.key);
  }

  window.addEventListener('load', boot);
})();
</script>
